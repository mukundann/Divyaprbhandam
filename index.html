<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Divya Prabandham Anusandhanam</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 680px;
            box-sizing: border-box;
            position: relative;
        }

        h2 {
            text-align: center;
            color: #1c1e21;
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 4px;
            color: #4b4f56;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd0d5;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fff;
            color: #1c1e21;
            height: 42px;
        }

        select:focus,
        input:focus {
            border-color: #0070ba;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 112, 186, 0.15);
        }

        /* READJUSTED COMPACT SELECTION & CONFIGURATION GRID */
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .flex-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 46px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            user-select: none;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-play {
            width: 100%;

            padding: 14px 10px;
            background-color: #0070ba;
            color: white;
            border: none;

            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(0, 112, 186, 0.2);

            margin-bottom: 0;
            letter-spacing: 0.5px;
            height: 48px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-play:hover {
            background-color: #005a96;
        }

        .btn-nav {

            padding: 14px 10px;
            background-color: #e4e6eb;
            color: #050505;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            height: 48px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status {
            margin-top: 12px;
            font-size: 0.75rem;
            color: #0070ba;
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* EXPANDED PASURAM DISPLAY TEXT AREA */
        .pasuram-text-panel {
            background: #fffdf2;
            border: 1px solid #f6e58d;
            padding: 20px 16px;
            border-radius: 12px;
            margin-top: 14px;
            font-size: clamp(1.3rem, 5vw, 1.65rem);
            line-height: 1.7;
            color: #2c3e50;
            text-align: center;
            box-sizing: border-box;
            white-space: normal;
            word-break: break-word;
            overflow-wrap: break-word;
            min-height: 280px;
            max-height: calc(100vh - 340px);
            overflow-y: auto;
        }

        .pasuram-text-panel span.active-segment {
            font-weight: 700;
            color: #000000;
            background-color: #fbe251;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline;
            margin: 0 2px;
        }

        .pasuram-text-panel span.normal-segment {
            font-weight: 400;
            display: inline;
            margin: 0 2px;
        }

        #audioPlayer {
            display: none;
        }

        @media (min-width: 580px) {
            .card {
                padding: 24px;
            }

            .pasuram-text-panel {
                min-height: 340px;
            }
        }
    </style>
</head>

<body>

    <div id="mainCard" class="card">
        <h2>AruLicheyal Sandhai Player</h2>

        <div class="config-grid">
            <div class="input-group">
                <label>Prabandham</label>

                <select id="prefix" onchange="resetToStart()">
                    <option value="TPL">ThiruppaLLANdu</option>
                    <option value="PAT">Periyaazhwaar Thirumozhi</option>
                    <option value="TPV">Thiruppaavai</option>
                    <option value="NAT">Naachiyar Thirumozhi</option>
                    <option value="PMT" selected>Perumal Thirumozhi</option>
                    <option value="TCV">Thiruchchandha Viruththam</option>
                    <option value="TML">Thirumaalai</option>
                    <option value="TPE">ThiruppaLLiyezhuchchi</option>
                    <option value="AAP">Amalanaadhipiraan</option>
                    <option value="KCT">Kanninunchiruththaambu</option>
                    <option value="PT">Periya Thirumozhi</option>
                    <option value="MUT">Moondram Thiruvandhadhi</option>
                    <option value="TVM">Thiruvaimozhi</option>
                    <option value="RN">Ramanusa Nootrandhadhi</option>
                </select>
            </div>

            <div class="input-group">
                <label id="numLabel">Pasuram (Ch.Sub.Pas)</label>
                <input type="text" id="number" value="1.1" inputmode="decimal">
            </div>

            <div class="input-group">
                <label>Learning Mode</label>
                <select id="learningStep" onchange="resetLineTracking()">
                    <option value="step1">Step 1: Half-Line</option>
                    <option value="step2" selected>Step 2: One-Line</option>
                    <option value="step3">Step 3: Two-Line</option>
                    <option value="step4">Step 4: Full Practice</option>
                </select>
            </div>

            <div class="input-group">
                <label>Speed</label>
                <select id="playbackSpeed" onchange="updateEngineSpeed()">
                    <option value="0.75">0.75x (Slower)</option>
                    <option value="0.85">0.85x</option>
                    <option value="1.0" selected>1.0x (Normal)</option>
                    <option value="1.15">1.15x</option>
                    <option value="1.25">1.25x (Faster)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Repeat</label>
                <input type="number" id="repeatLimit" value="2" min="1">
            </div>
            <div class="input-group">
                <label>Language</label>
                <select id="textLanguage" onchange="renderCurrentPasuramText()">
                    <option value="ta" selected>தமிழ் (Tamil)</option>
                    <option value="en">Romanized English</option>
                </select>
            </div>

            <div class="input-group">
                <label>Auto-Advance</label>
                <select id="autoNext">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
            </div>
        </div>

        <div style="display: none;">
            <select id="recitationFocus">
                <option value="both" selected>Play Both</option>
            </select>
        </div>




        <div class="nav-controls" style="grid-template-columns: 1fr 2fr 1fr;">
            <button class="btn-nav" onclick="navigate(-1)">Prev</button>
            <button id="toggleBtn" class="btn-play" onclick="handlePlaybackToggle()">START RECITATION</button>
            <button class="btn-nav" onclick="navigate(1)">Next</button>
        </div>
                <div id="pasuramDisplay" class="pasuram-text-panel">
            <em>Select a file or press start to view pasuram lines...</em>
        </div>

        <audio id="audioPlayer" playsinline></audio>
        <div id="status" class="status">Ready</div>
    </div>
    <script src="sync_engine.js"></script>
    <script src="config.js"></script>
    <script src="navigation.js"></script>
    <script src="markerProcessor.js"></script>

    <script src="playerEngine.js"></script>
    <script src="learningEngine.js"></script>


</body>


</html>
