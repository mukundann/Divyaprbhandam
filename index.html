<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Divya Prabandham Anusandhanam</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 680px;
            box-sizing: border-box;
            position: relative;
        }

        h2 {
            text-align: center;
            color: #1c1e21;
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 4px;
            color: #4b4f56;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        select,
        input[type="text"],
        input[type="number"],
        input:not([type]) {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccd0d5;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fff;
            color: #1c1e21;
            height: 38px;
            min-height: 38px;
        }

        select:focus,
        input:focus {
            border-color: #0070ba;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 112, 186, 0.15);
        }

        /* Hierarchical pasuram pickers — friendly labels, short lists / number */
        .pasuram-pickers {
            display: grid;
            grid-template-columns: 1fr 1fr minmax(4.5rem, 5.5rem);
            gap: 8px;
            width: 100%;
            align-items: end;
        }

        .pasuram-pickers.no-sub {
            grid-template-columns: 1fr minmax(4.5rem, 5.5rem);
        }

        .picker-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .picker-field label {
            margin: 0;
            font-size: 0.68rem;
            letter-spacing: 0.3px;
            color: #65676b;
        }

        .pasuram-pickers select,
        .pasuram-pickers input[type="number"] {
            width: 100%;
            min-width: 0;
        }

        .pasuram-pickers select.hidden,
        .pasuram-pickers .picker-field.hidden {
            display: none !important;
        }

        .pasuram-hint {
            margin-top: 6px;
            font-size: 0.78rem;
            color: #65676b;
            font-weight: 500;
            letter-spacing: 0.2px;
            text-transform: none;
        }

        /* Layout: selection first, then practice options */
        .config-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 4px;
        }

        .config-row {
            display: grid;
            gap: 10px;
        }

        .config-row-primary {
            grid-template-columns: 1fr;
        }

        /* Practice controls: 3 on first row, 2 aligned under first columns */
        .config-row-practice {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .input-group {
            margin-bottom: 0;
        }

        @media (min-width: 581px) {
            .card {
                max-width: 720px;
            }

            .config-row-primary {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .pasuram-pickers {
                max-width: 360px;
            }

            .config-row-practice {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 12px;
            }
        }

        .flex-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 46px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            user-select: none;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-play {
            width: 100%;

            padding: 14px 10px;
            background-color: #0070ba;
            color: white;
            border: none;

            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(0, 112, 186, 0.2);

            margin-bottom: 0;
            letter-spacing: 0.5px;
            height: 48px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-play:hover {
            background-color: #005a96;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 4px;
        }

        .header-row h2 {
            margin: 0;
            flex: 1;
        }

        .copy-link-btn {
            flex-shrink: 0;
            min-height: 36px;
            padding: 8px 12px;
            background-color: #e4e6eb;
            color: #050505;
            border: none;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .copy-link-btn:hover {
            background-color: #d8dadf;
        }

        .btn-nav {

            padding: 14px 10px;
            background-color: #e4e6eb;
            color: #050505;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            height: 48px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status {
            margin-top: 12px;
            font-size: 0.75rem;
            color: #0070ba;
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* EXPANDED PASURAM DISPLAY TEXT AREA */
        .pasuram-text-panel {
            background: #fffdf2;
            border: 1px solid #f6e58d;
            padding: 20px 16px;
            border-radius: 12px;
            margin-top: 14px;
            font-size: clamp(1.3rem, 5vw, 1.65rem);
            line-height: 1.7;
            color: #2c3e50;
            text-align: center;
            box-sizing: border-box;
            white-space: normal;
            word-break: break-word;
            overflow-wrap: break-word;
            min-height: 280px;
            max-height: calc(100vh - 340px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .pasuram-text-panel span.active-segment {
            font-weight: 700;
            color: #000000;
            background-color: #fbe251;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline;
            margin: 0 2px;
        }

        .pasuram-text-panel span.normal-segment {
            font-weight: 400;
            display: inline;
            margin: 0 2px;
        }

        #audioPlayer {
            display: none;
        }

        @media (min-width: 581px) {
            .card {
                padding: 24px;
            }

            .pasuram-text-panel {
                min-height: 340px;
            }
        }

        /* Single-screen mobile: chrome fixed, only verse text may scroll */
        @media (max-width: 580px) {
            html,
            body {
                height: 100%;
                max-height: 100dvh;
                overflow: hidden;
                overscroll-behavior: none;
            }

            body {
                align-items: stretch;
                padding: 0;
                min-height: 100dvh;
                min-height: 100svh;
            }

            .card {
                display: flex;
                flex-direction: column;
                width: 100%;
                max-width: none;
                height: 100dvh;
                height: 100svh;
                max-height: 100dvh;
                max-height: 100svh;
                margin: 0;
                padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
                border-radius: 0;
                box-shadow: none;
                overflow: hidden;
            }

            .header-row {
                flex-shrink: 0;
                margin-bottom: 2px;
                gap: 8px;
            }

            .header-row h2 {
                font-size: 1rem;
                text-align: left;
                line-height: 1.2;
            }

            .copy-link-btn {
                min-height: 30px;
                height: 30px;
                padding: 0 10px;
                font-size: 0.72rem;
                border-radius: 6px;
            }

            .config-stack {
                flex-shrink: 0;
                gap: 6px;
                margin-bottom: 0;
            }

            .config-row {
                gap: 6px;
            }

            .config-row-primary {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            label {
                font-size: 0.65rem;
                margin-bottom: 2px;
                letter-spacing: 0.2px;
            }

            select,
            input[type="text"],
            input[type="number"],
            input:not([type]) {
                height: 32px;
                min-height: 32px;
                padding: 4px 8px;
                font-size: 13px;
                border-radius: 6px;
            }

            .pasuram-pickers,
            .pasuram-pickers.no-sub {
                grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(3.25rem, 4.25rem);
                gap: 6px;
            }

            .pasuram-pickers.no-sub {
                grid-template-columns: 1fr minmax(3.25rem, 4.25rem);
            }

            .pasuram-pickers #pasVerseField {
                grid-column: auto;
            }

            .picker-field {
                gap: 2px;
            }

            .picker-field label {
                font-size: 0.6rem;
            }

            .pasuram-hint {
                margin-top: 3px;
                font-size: 0.68rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .config-row-practice {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .nav-controls {
                flex-shrink: 0;
                gap: 8px;
                margin-top: 8px;
            }

            button,
            .btn-nav,
            .btn-play {
                height: 40px;
                min-height: 40px;
                border-radius: 8px;
                font-size: 0.85rem;
            }

            .btn-play {
                padding: 8px 6px;
                font-size: 0.82rem;
                letter-spacing: 0.3px;
                box-shadow: 0 2px 8px rgba(0, 112, 186, 0.18);
            }

            .pasuram-text-panel {
                flex: 1 1 auto;
                min-height: 0;
                max-height: none;
                margin-top: 8px;
                padding: 10px 12px;
                border-radius: 10px;
                font-size: clamp(1.05rem, 4.2vw, 1.35rem);
                line-height: 1.45;
            }
        }
    </style>
</head>

<body>

    <div id="mainCard" class="card">
        <div class="header-row">
            <h2>AruLicheyal Sandhai Player</h2>
            <button type="button" id="copyLinkBtn" class="copy-link-btn" onclick="copyShareLink()" title="Copy shareable link to this prabandham and pasuram">Copy link</button>
        </div>

        <div class="config-stack">
            <div class="config-row config-row-primary">
                <div class="input-group">
                    <label for="prefix">Prabandham</label>
                    <select id="prefix" onchange="resetToStart()">
                        <optgroup label="1000 - Mudhalaayiram">
                            <option value="TPL">ThiruppaLLaaNdu</option>
                            <option value="PAT">Periyaazhwaar Thirumozhi</option>
                            <option value="TPV">Thiruppaavai</option>
                            <option value="NAT">Naachiyaar Thirumozhi</option>
                            <option value="PMT" selected>PerumaaL Thirumozhi</option>
                            <option value="TCV">Thiruchchandha Viruththam</option>
                            <option value="TML">Thirumaalai</option>
                            <option value="TPE">ThiruppaLLiyezhuchchi</option>
                            <option value="AAP">Amalanaadhipiraan</option>
                            <option value="KCT">Kanninunchiruththaambu</option>
                        </optgroup>
                        <optgroup label="2000 - Periya Thirumozhi">
                            <option value="PTM">Periya Thirumozhi</option>
                            <option value="TKT">Thirukkurunthaandakam</option>
                            <option value="TNT">Thirunedunthaandakam</option>
                        </optgroup>
                        <optgroup label="3000 - Iyarpaa">
                            <option value="1TA">Mudhal Thiruvandhaadhi</option>
                            <option value="2TA">Irandaam Thiruvandhaadhi</option>
                            <option value="3TA">Moondraam Thiruvandhaadhi</option>
                        </optgroup>
                        <optgroup label="4000 - Thiruvaaimozhi">
                            <option value="TVM">Thiruvaaimozhi</option>
                            <option value="RN">Raamaanusa Nootrandhaadhi</option>
                        </optgroup>
                        <optgroup label="Others">
                            <option value="URM">UpadEsa Rathinamaalai</option>
                        </optgroup>
                    </select>
                </div>

                <div class="input-group input-group-pasuram">
                    <label id="numLabel">Paasuram</label>
                    <div class="pasuram-pickers" id="pasuramPickers" role="group" aria-labelledby="numLabel">
                        <div class="picker-field" id="pasPartField">
                            <label for="pasPart">Chapter</label>
                            <select id="pasPart" aria-label="Chapter or taniyans" onchange="onPasuramPickerChange()">
                                <option value="0">Taniyan</option>
                                <option value="1">1</option>
                            </select>
                        </div>
                        <div class="picker-field hidden" id="pasSubField">
                            <label for="pasSub">Decad</label>
                            <select id="pasSub" aria-label="Decad" onchange="onPasuramPickerChange()"></select>
                        </div>
                        <div class="picker-field" id="pasVerseField">
                            <label for="pasVerse">No.</label>
                            <input id="pasVerse" type="number" min="1" step="1" inputmode="numeric"
                                aria-label="Pasuram number" placeholder="1" value="1"
                                onchange="onPasuramPickerChange()" enterkeyhint="done">
                        </div>
                    </div>
                    <div class="pasuram-hint" id="pasuramHint" aria-live="polite"></div>
                    <input type="hidden" id="number" value="0.1">
                </div>
            </div>

            <div class="config-row config-row-practice">
                <div class="input-group">
                    <label for="learningStep">Learning Mode</label>
                    <select id="learningStep" onchange="onLearningStepChange()">
                        <option value="step1" selected>Half-Line</option>
                        <option value="step2">One-Line</option>
                        <option value="step3">Two-Line</option>
                        <option value="step4">Full Practice</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="playbackSpeed">Speed</label>
                    <select id="playbackSpeed" onchange="updateEngineSpeed()">
                        <option value="0.75">0.75x (Slower)</option>
                        <option value="0.85">0.85x</option>
                        <option value="1.0" selected>1.0x (Normal)</option>
                        <option value="1.15">1.15x</option>
                        <option value="1.25">1.25x (Faster)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="textLanguage">Language</label>
                    <select id="textLanguage" onchange="renderCurrentPasuramText()">
                        <option value="ta" selected>தமிழ் (Tamil)</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="repeatLimit">Repeat</label>
                    <input type="number" id="repeatLimit" value="3" min="1" onchange="onSessionPrefChange()">
                </div>
                <div class="input-group">
                    <label for="autoNext">Auto-Advance</label>
                    <select id="autoNext" onchange="onSessionPrefChange()">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
            </div>
        </div>

        <div style="display: none;">
            <select id="recitationFocus">
                <option value="both" selected>Play Both</option>
            </select>
        </div>




        <div class="nav-controls" style="grid-template-columns: 1fr 2fr 1fr;">
            <button class="btn-nav" onclick="navigate(-1)">Prev</button>
            <button id="toggleBtn" class="btn-play" onclick="handlePlaybackToggle()">START RECITATION</button>
            <button class="btn-nav" onclick="navigate(1)">Next</button>
        </div>
        <div id="pasuramDisplay" class="pasuram-text-panel">
            <em>Select a file or press start to view pasuram lines...</em>
        </div>

        <audio id="audioPlayer" playsinline></audio>
        <!-- <div id="status" class="status">Ready</div> -->
    </div>
    <script src="sync_engine.js"></script>
    <script src="config.js"></script>
    <script src="navigation.js"></script>
    <script src="markerProcessor.js"></script>

    <script src="playerEngine.js"></script>
    <script src="learningEngine.js"></script>


</body>


</html>
