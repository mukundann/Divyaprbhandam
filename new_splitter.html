<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Marker Studio - Native Script Pipeline</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 15px;
            background-color: #f4f6f9;
            color: #333;
        }

        .container {
            max-width: 1550px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            gap: 25px;
        }

        .left-panel {
            flex: 1;
            min-width: 420px;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .right-panel {
            flex: 1.4;
            min-width: 550px;
            border-left: 1px solid #e0e0e0;
            padding-left: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
            color: #4a5568;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
        }

        .btn-success:hover {
            background-color: #218838;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        #marker-list {
            max-height: 620px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 10px;
            background: #f8fafc;
        }

        .marker-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: #fff;
            border: 1px solid #edf2f7;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .marker-item input[type="number"] {
            width: 70px;
            padding: 6px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 12px;
        }

        .marker-item input[type="text"] {
            flex: 1;
            padding: 6px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 12px;
        }

        .checkbox-label {
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            white-space: nowrap;
        }

        #livePasuramView {
            background: #1e1e24;
            color: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            font-size: 15px;
            line-height: 1.8;
            max-height: 220px;
            overflow-y: auto;
        }

        #livePasuramView hr {
            border-top: 1px dashed #444;
            margin: 8px 0;
        }

        .active-phrase {
            background: #ffeb3b;
            color: #000;
            padding: 0 4px;
            border-radius: 3px;
            font-weight: bold;
        }

        .normal-phrase {
            color: #e0e0e0;
            opacity: 0.85;
        }

        textarea {
            width: 100%;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
            background: #fafafa;
            white-space: pre;
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="left-panel">
            <div class="card" style="background: #f8fafc; border: 1px solid #cbd5e0;">
                <h3 style="margin-top:0; color:#1e293b; border-bottom:2px solid #3b82f6; padding-bottom:6px;">📥 Native
                    Script Ingestion Pipeline</h3>

                <div class="form-group">
                    <label>1. Audio Stream Target</label>
                    <input type="file" accept="audio/*" onchange="loadLocalAudio(this)"
                        style="margin-bottom:6px; display:block; font-size:12px;">
                    <input type="text" id="audioUrlInput" placeholder="Paste raw audio link...">
                </div>

                <div class="form-group">
                    <label>2. Text Companion Script File <span style="font-weight:normal; color:#64748b;">(auto-filled from audio)</span></label>
                    <input type="file" accept=".js" onchange="injectLocalScriptAsset(this)"
                        style="margin-bottom:6px; display:block; font-size:12px;">
                    <input type="text" id="textUrlInput" placeholder="Auto-filled on audio select, or paste URL...">
                </div>

                <div class="form-group">
                    <label>3. Timeline File <span style="font-weight:normal; color:#64748b;">(auto-filled from audio)</span></label>
                    <input type="file" accept=".js" onchange="injectLocalScriptAsset(this)"
                        style="margin-bottom:6px; display:block; font-size:12px;">
                    <input type="text" id="stepsUrlInput" placeholder="Auto-filled on audio select, or paste URL...">
                </div>


                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn btn-primary" style="flex: 1;"
                        onclick="triggerUnifiedNetworkPipelineFetch()">Load Files ⚡</button>
                    <button class="btn btn-danger" onclick="clearWorkspaceState()">Reset Canvas</button>
                </div>

                <div style="margin-top: 12px; display: flex; align-items: center; gap: 6px;">
                    <input type="checkbox" id="rippleTimeAdjustmentsToggle" checked style="cursor: pointer;">
                    <label for="rippleTimeAdjustmentsToggle"
                        style="font-size: 12px; font-weight: 600; color: #475569; cursor: pointer; user-select: none;">
                        🔄 Ripple changes to subsequent segments
                    </label>
                </div>

            </div>

            <div id="pipelineKeySelectorContainer" class="card"
                style="display:none; background:#ecfdf5; border:1px solid #a7f3d0;"></div>

            <div class="card">
                <h4 style="margin:0 0 8px 0; color:#334155;">🎧 Media Playback Controls</h4>
                <div id="timeDisplay" style="font-size:24px; font-weight:bold; color:#0f172a; margin-bottom:4px;">0.0s
                </div>
                <audio id="player" controls></audio>
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <button class="btn btn-primary" onclick="rewindPlayback()">↩ Rewind 2s</button>
                    <button id="captureBtn" class="btn btn-success" onclick="captureLiveTimestamp()" disabled>Capture
                        Stamp (M)</button>
                </div>
            </div>

            <div class="card">
                <h4 style="margin:0 0 8px 0; color:#334155;"># Live Verse Synchronizer View</h4>
                <div id="livePasuramView"><em>Load assets to generate dynamic highlighter canvas...</em></div>
            </div>
        </div>

        <div class="right-panel">
            <div class="card" style="flex: 1; display:flex; flex-direction:column; gap:10px;">
                <div style="display:flex; justify-content:between; align-items:center;">
                    <h3 id="status" style="margin:0; color:#1e293b;">Markers: 0</h3>
                    <div style="margin-left:auto;">
                        <button class="btn btn-primary" onclick="reproportionalizeTimelineDist()">Distribute
                            Uniformly</button>
                    </div>
                </div>

                <div id="marker-list">
                    <div style="text-align:center; color:#94a3b8; padding:50px 0;">Workspace clear. Ingest asset
                        configurations to populate interactive canvas grids.</div>
                </div>
            </div>

            <div class="card">
                <h4 style="margin:0 0 6px 0; color:#334155;">💾 Compiled Database Configuration File Output</h4>
                <textarea id="ioJson" rows="10"
                    placeholder="Valid JavaScript payload arrays auto-serialize here..."></textarea>
                <div style="margin-top:8px; display:flex; gap:10px;">
                    <button class="btn btn-success" onclick="importFromRawConfigSnippet()">Import Structured
                        Configuration Code Block</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize global structures if not loaded yet
        window.MARKER_DATABASE = window.MARKER_DATABASE || {};
        window.rawMarkers = [];

        let currentHighlightIndex = -1;
        let currentFileName = "audio_data";
        let currentAudioFileName = ""; // tracks the audio file basename separately for range detection
        let detectedDuration = 0;

        window.isUserEditingActiveCell = false;
        window.isTestingSegmentAudio = false;
        let isSystemImportingData = false;

        let player, markerList, ioJson, livePasuramView;

        window.addEventListener('DOMContentLoaded', () => {
            player = document.getElementById('player');
            markerList = document.getElementById('marker-list');
            ioJson = document.getElementById('ioJson');
            livePasuramView = document.getElementById('livePasuramView');
            setupGlobalSyncLoop();

            // Try restoring from localStorage cache snapshot
            const cachedMarkers = localStorage.getItem('asm_saved_markers');
            const cachedFilename = localStorage.getItem('asm_current_filename');

            if (cachedMarkers) {
                try {
                    window.rawMarkers = JSON.parse(cachedMarkers);
                    if (cachedFilename) currentFileName = cachedFilename;

                    isSystemImportingData = true;
                    renderTimelineGridCanvas(true);
                    serializeWorkspaceStateToJsCodeblock();
                    isSystemImportingData = false;
                } catch (e) {
                    console.error("Failed to restore canvas snapshot from localStorage", e);
                }
            }

            window.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 'm') {
                    const active = document.activeElement;
                    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
                    e.preventDefault();
                    captureLiveTimestamp();
                }
            });

            markerList.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.shiftKey) {
                    const activeRow = e.target.closest('.marker-item');
                    if (activeRow) {
                        e.preventDefault();
                        const index = parseInt(activeRow.id.replace('item-', ''), 10);
                        if (!isNaN(index)) insertMidpointSegmentRow(index);
                    }
                }
            });
        });

        function loadLocalAudio(input) {
            if (!input || !input.files || input.files.length === 0) return;
            const file = input.files[0];
            initiateAudioStreamingNode(URL.createObjectURL(file), file.name);
            autoFillCompanionPaths(file.name);
        }

        /**
         * Derives the book key from the audio filename and auto-fills the text
         * and timeline URL fields with their standard relative paths.
         * e.g. "RN_11_20.ogg" → book=RN → fills marker_rn_ta.js + marker_rn_timelines.js
         */
        /**
         * Parse audio filename into components.
         * Returns: { book, chapter, subChapter, type }
         *   type: 'grouped'     e.g. RN_11_20    → chapter=null, range via parseRangeFromFilename
         *         'simple'      e.g. AAP_1        → chapter=1, subChapter=null
         *         'subchapter'  e.g. PAT_3.1      → chapter=3, subChapter=1
         */
        function parseAudioFilename(audioFilename) {
            const base = audioFilename.replace(/\.[^.]+$/, ''); // strip extension

            // Sub-chapter: BOOK_CH.SUBCH  e.g. PAT_3.1
            const subMatch = base.match(/^([A-Za-z0-9]+)_(\d+)\.(\d+)$/);
            if (subMatch) return { book: subMatch[1], chapter: parseInt(subMatch[2]), subChapter: parseInt(subMatch[3]), type: 'subchapter' };

            // Grouped: BOOK_START_END  e.g. RN_11_20
            const groupMatch = base.match(/^([A-Za-z0-9]+)_(\d+)_(\d+)$/);
            if (groupMatch) return { book: groupMatch[1], chapter: null, subChapter: null, type: 'grouped' };

            // Simple single chapter: BOOK_N  e.g. AAP_1, PMT_3
            const simpleMatch = base.match(/^([A-Za-z0-9]+)_(\d+)$/);
            if (simpleMatch) return { book: simpleMatch[1], chapter: parseInt(simpleMatch[2]), subChapter: null, type: 'simple' };

            return null;
        }

        function autoFillCompanionPaths(audioFilename) {
            const parsed = parseAudioFilename(audioFilename);
            if (!parsed) return;

            const { book, chapter, type } = parsed;
            const bLow = book.toLowerCase();
            const root = 'aruLicheyal';

            let textPath, timelinePath;

            if (type === 'subchapter') {
                // PAT_3.1 → text/3_ta.js, markers/timelines_3.js
                textPath     = `${root}/${book}/text/${chapter}_ta.js`;
                timelinePath = `${root}/${book}/markers/timelines_${chapter}.js`;
            } else {
                // grouped (RN_11_20) or simple (AAP_1) → flat marker files
                textPath     = `${root}/${book}/text/marker_${bLow}_ta.js`;
                timelinePath = `${root}/${book}/markers/marker_${bLow}_timelines.js`;
            }

            const textEl  = document.getElementById('textUrlInput');
            const stepsEl = document.getElementById('stepsUrlInput');

            if (textEl)  textEl.value  = textPath;
            if (stepsEl) stepsEl.value = timelinePath;

            console.log(`[Splitter] Auto-filled [${type}] paths for book "${book}":`, textPath, timelinePath);
        }

        function initiateAudioStreamingNode(url, targetFilename = "") {
            const rawName = targetFilename || url.split('/').pop().split('?')[0] || "audio_track";
            // Strip only the final extension (.ogg) — preserve dots in sub-chapter names like PAT_3.1
            currentAudioFileName = rawName.replace(/\.[^.]+$/, '');
            currentFileName = currentAudioFileName;
            player.src = url;
            player.load();
            document.getElementById('captureBtn').disabled = false;
            player.onloadedmetadata = function () {
                detectedDuration = player.duration;
                evaluateIncomingPipelineAssets();
            };
        }

        // Direct clean script dynamic injector method
        function injectLocalScriptAsset(input) {
            if (!input || !input.files || input.files.length === 0) return;
            const scriptUrl = URL.createObjectURL(input.files[0]);
            appendScriptNodeToDOM(scriptUrl, () => {
                // Check if text bundle engine merge function is present inside language definitions
                if (typeof window.mergeLanguageTexts === 'function') {
                    window.mergeLanguageTexts();
                }
                evaluateIncomingPipelineAssets();
            });
        }

        function appendScriptNodeToDOM(srcUrl, callback) {
            const script = document.createElement('script');
            script.src = srcUrl;
            script.async = false;
            script.onload = () => {
                if (callback) callback();
            };
            script.onerror = () => console.error("Could not parse native script resource context cleanly.");
            document.head.appendChild(script);
        }

        async function triggerUnifiedNetworkPipelineFetch() {
            const audioUrl = document.getElementById('audioUrlInput').value.trim();
            const textUrl = document.getElementById('textUrlInput').value.trim();
            const stepsUrl = document.getElementById('stepsUrlInput').value.trim();

            const parseCleanUrl = (u) => u.includes('github.com') && u.includes('/blob/') ? u.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/') : u;

            if (audioUrl) initiateAudioStreamingNode(parseCleanUrl(audioUrl));

            let tracksLoaded = 0;
            const checkSyncStatus = () => {
                tracksLoaded++;
                if (tracksLoaded >= [textUrl, stepsUrl].filter(Boolean).length) {
                    if (typeof window.mergeLanguageTexts === 'function') window.mergeLanguageTexts();
                    evaluateIncomingPipelineAssets();
                }
            };

            if (textUrl) appendScriptNodeToDOM(parseCleanUrl(textUrl), checkSyncStatus);
            if (stepsUrl) appendScriptNodeToDOM(parseCleanUrl(stepsUrl), checkSyncStatus);
        }

        function evaluateIncomingPipelineAssets() {
            const targetKeys = Object.keys(window.MARKER_DATABASE || {});
            if (targetKeys.length === 0) return;

            // Auto-detect best matching key from audio filename
            const bestKey = pickBestMarkerKey(targetKeys, currentAudioFileName);

            if (bestKey) {
                // Auto-load without showing dropdown
                autoLoadMarkerKey(bestKey, targetKeys);
            } else {
                // Multiple ambiguous keys — show selector
                renderPipelineSelectorDropdownPanel(targetKeys);
            }
        }

        /**
         * Picks the best MARKER_DATABASE key for the current audio file.
         *
         * RN_11_20    → keys like "RN.1.steps"    → match on book "RN"
         * AAP_1       → keys like "AAP.1.steps"   → match on book + chapter "AAP.1"
         * PAT_3.1     → keys like "PAT.3.10.steps"→ match on book + chapter "PAT.3"
         */
        function pickBestMarkerKey(keys, audioFilename) {
            if (!audioFilename) return keys.length === 1 ? keys[0] : null;

            const parsed = parseAudioFilename(audioFilename);
            if (!parsed) return keys.length === 1 ? keys[0] : null;

            const { book, chapter, type } = parsed;
            const bLow = book.toLowerCase();

            if (type === 'subchapter' && chapter !== null) {
                // Match keys containing book + chapter: "PAT.3."
                const prefix = `${bLow}.${chapter}.`;
                const matching = keys.filter(k => k.toLowerCase().includes(prefix));
                if (matching.length === 1) return matching[0];
                if (matching.length > 1) return matching[0]; // pick first (most likely steps key)
            }

            if (type === 'simple' && chapter !== null) {
                // Match keys containing book + chapter: "AAP.1."
                const prefix = `${bLow}.${chapter}.`;
                const matching = keys.filter(k => k.toLowerCase().includes(prefix));
                if (matching.length === 1) return matching[0];
            }

            // grouped or fallback: match on book name only
            const matching = keys.filter(k => k.toLowerCase().includes(bLow));
            if (matching.length === 1) return matching[0];
            if (keys.length === 1) return keys[0];
            return null; // ambiguous — show dropdown
        }

        function autoLoadMarkerKey(key, allKeys) {
            // Pre-select in dropdown (in case user needs to change it)
            renderPipelineSelectorDropdownPanel(allKeys, key);
            // Then immediately load
            buildActiveWorkspaceCanvasTimeline(key);
        }

        function renderPipelineSelectorDropdownPanel(keys, selectedKey = null) {
            const container = document.getElementById('pipelineKeySelectorContainer');
            container.innerHTML = `
                <label style="color:#065f46; font-size:13px; font-weight:bold; display:block; margin-bottom:5px;">
                    🎯 Marker Key
                </label>
                <div style="display:flex; gap:10px; align-items:center;">
                    <select id="selectedPipelineTargetNamespace" style="flex:1; padding:6px; font-size:12px; border:1px solid #10b981; border-radius:4px; height:32px;">
                        ${keys.map(k => `<option value="${k}" ${k === selectedKey ? 'selected' : ''}>${k}</option>`).join('')}
                    </select>
                    <button class="btn btn-success" style="padding:6px 14px;" onclick="buildActiveWorkspaceCanvasTimeline()">Load</button>
                </div>
            `;
            container.style.display = 'block';
        }

        /**
         * Parse the pasuram range from the audio filename.
         * "RN_11_20"   → { start: 11, end: 20, type: 'grouped' }
         * "AAP_1"      → { start: null, end: null, type: 'simple' }   load all
         * "PAT_3.1"    → { start: null, end: null, type: 'subchapter' } load all for that chapter
         * Returns null if unparseable (load all).
         */
        function parseRangeFromFilename(filename) {
            const parsed = parseAudioFilename(filename);
            if (!parsed) return null;

            if (parsed.type === 'grouped') {
                // Extract start/end from BOOK_START_END
                const m = filename.match(/_(\d+)_(\d+)/);
                if (m) return { start: parseInt(m[1], 10), end: parseInt(m[2], 10), type: 'grouped' };
            }

            // simple and subchapter: load all entries (no pasuram filtering needed)
            return null;

            return null; // no range info — load all
        }

        function buildActiveWorkspaceCanvasTimeline(overrideKey = null) {
            const sel = document.getElementById('selectedPipelineTargetNamespace');
            const targetNamespaceKey = overrideKey || (sel ? sel.value : null);
            if (!targetNamespaceKey) return;

            currentFileName = targetNamespaceKey;

            // Determine pasuram range from audio filename (not the namespace key)
            const audioRange = parseRangeFromFilename(currentAudioFileName);
            console.log(`[Splitter] Audio file: "${currentAudioFileName}" → Range: ${audioRange ? `p${audioRange.start}–${audioRange.end}` : 'all'}`);

            // 1. Trace and extract text directly from the native nested script engine structure
            let textSourceMap = {};
            if (window.text_bundle_ta && window.text_bundle_ta[targetNamespaceKey]) {
                textSourceMap = window.text_bundle_ta[targetNamespaceKey];
            } else if (window.MARKER_DATABASE[targetNamespaceKey] && window.MARKER_DATABASE[targetNamespaceKey]._textSourceMap) {
                textSourceMap = window.MARKER_DATABASE[targetNamespaceKey]._textSourceMap;
            } else if (Array.isArray(window.MARKER_DATABASE[targetNamespaceKey])) {
                // Check if text is attached directly onto array items
                window.MARKER_DATABASE[targetNamespaceKey].forEach(block => {
                    if (block && block.p && block.text && block.text.ta) {
                        textSourceMap[block.p] = block.text.ta;
                    }
                });
            }

            const allSteps = window.MARKER_DATABASE[targetNamespaceKey] || [];

            // Filter to only the pasurums covered by the loaded audio file
            const stepsSourceTimelineArray = audioRange
                ? allSteps.filter(b => b.p >= audioRange.start && b.p <= audioRange.end)
                : allSteps;

            // Also filter textSourceMap to the same range
            if (audioRange) {
                const filteredTextMap = {};
                Object.keys(textSourceMap).forEach(k => {
                    const n = parseInt(k, 10);
                    if (n >= audioRange.start && n <= audioRange.end) filteredTextMap[k] = textSourceMap[k];
                });
                textSourceMap = filteredTextMap;
            }

            let unifiedCompiledMarkers = [];

            // Check if we actually have valid step timing blocks
            let hasTimings = Array.isArray(stepsSourceTimelineArray) &&
                stepsSourceTimelineArray.length > 0 &&
                stepsSourceTimelineArray.some(b => b.step1 && b.step1.length > 0);

            if (hasTimings) {
                // Path A: Parse standard existing timeline steps
                stepsSourceTimelineArray.forEach((pasuramBlock, blockIdx) => {
                    if (!pasuramBlock || typeof pasuramBlock !== 'object') return;

                    const step1Timelines = pasuramBlock.step1 || [];
                    const pIndex = pasuramBlock.p || (blockIdx + 1);
                    const matchingRawTextLineString = pasuramBlock.text && pasuramBlock.text.ta ? pasuramBlock.text.ta : (textSourceMap[pIndex] || "");
                    let splitPhrases = matchingRawTextLineString.split('*').map(t => t.trim()).filter(t => t.length > 0);

                    const currentStep2 = pasuramBlock.step2 ? JSON.parse(JSON.stringify(pasuramBlock.step2)) : null;
                    const currentStep3 = pasuramBlock.step3 ? JSON.parse(JSON.stringify(pasuramBlock.step3)) : null;
                    const currentStep4 = pasuramBlock.step4 ? JSON.parse(JSON.stringify(pasuramBlock.step4)) : null;

                    for (let i = 0; i < step1Timelines.length; i++) {
                        let startTime = parseFloat(step1Timelines[i][0]);
                        let endTime = parseFloat(step1Timelines[i][1]);
                        let verseContent = splitPhrases[i] !== undefined ? splitPhrases[i] : "";

                        unifiedCompiledMarkers.push({
                            start: startTime,
                            end: endTime,
                            text: verseContent,
                            pIndex: pIndex,
                            forceEndBlock: (i === step1Timelines.length - 1),
                            origStep2: i === 0 ? currentStep2 : null,
                            origStep3: i === 0 ? currentStep3 : null,
                            origStep4: i === 0 ? currentStep4 : null
                        });
                    }
                });
            } else {
                // Path B: Timeline is missing/empty -> Extract text phrases and distribute evenly
                let allPhrases = [];

                // Collect phrases from the text map
                Object.keys(textSourceMap).sort((a, b) => parseInt(a) - parseInt(b)).forEach(pKey => {
                    let rawText = textSourceMap[pKey] || "";
                    let splitPhrases = rawText.split('*').map(t => t.trim()).filter(t => t.length > 0);

                    splitPhrases.forEach((phrase, i) => {
                        allPhrases.push({
                            text: phrase,
                            pIndex: parseInt(pKey),
                            isLastInBlock: (i === splitPhrases.length - 1)
                        });
                    });
                });

                if (allPhrases.length > 0) {
                    // Use audio duration if loaded, default to a 5-minute workspace canvas if not
                    let totalDuration = detectedDuration || 300;
                    let incrementStep = totalDuration / allPhrases.length;

                    allPhrases.forEach((phraseObj, idx) => {
                        let startTime = parseFloat((idx * incrementStep).toFixed(1));
                        let endTime = (idx === allPhrases.length - 1) ? parseFloat(totalDuration.toFixed(1)) : parseFloat(((idx + 1) * incrementStep).toFixed(1));

                        unifiedCompiledMarkers.push({
                            start: startTime,
                            end: endTime,
                            text: phraseObj.text,
                            pIndex: phraseObj.pIndex,
                            forceEndBlock: phraseObj.isLastInBlock,
                            origStep2: null, origStep3: null, origStep4: null
                        });
                    });
                }
            }

            if (unifiedCompiledMarkers.length > 0) {
                isSystemImportingData = true;
                window.rawMarkers = unifiedCompiledMarkers;
                renderTimelineGridCanvas(true);
                serializeWorkspaceStateToJsCodeblock();
                isSystemImportingData = false;
                document.getElementById('pipelineKeySelectorContainer').style.display = 'none';
            } else {
                alert("Could not load tracking context. Ensure script targets contain text or structural matrices.");
            }
        }

        function renderTimelineGridCanvas(forceFullRedraw = false) {
            if (!markerList || window.rawMarkers.length === 0) return;
            const currentDOMItemsLength = markerList.querySelectorAll('.marker-item').length;

            if (!forceFullRedraw && currentDOMItemsLength === window.rawMarkers.length) {
                window.rawMarkers.forEach((marker, idx) => {
                    const rowContainer = document.getElementById(`item-${idx}`);
                    if (rowContainer) {
                        const numericInputs = rowContainer.querySelectorAll('input[type="number"]');
                        const alphaTextInput = rowContainer.querySelector('input[type="text"]');
                        const breakingCheckbox = rowContainer.querySelector('input[type="checkbox"]');

                        if (numericInputs[0] && document.activeElement !== numericInputs[0]) numericInputs[0].value = marker.start;
                        if (numericInputs[1] && document.activeElement !== numericInputs[1]) numericInputs[1].value = marker.end;
                        if (alphaTextInput && document.activeElement !== alphaTextInput) alphaTextInput.value = marker.text;
                        if (breakingCheckbox) breakingCheckbox.checked = marker.forceEndBlock;
                    }
                });
                document.getElementById('status').innerText = `Markers: ${window.rawMarkers.length}`;
                return;
            }

            markerList.innerHTML = window.rawMarkers.map((marker, i) => {
                return `
            <div class="marker-item" id="item-${i}">
                <span style="font-weight:bold; min-width:35px; font-size:11px; color:#64748b;">P.${marker.pIndex || 1} #${i + 1}</span>
                <input type="number" step="0.1" value="${marker.start}" 
                       onfocus="window.isUserEditingActiveCell = true; window.isTestingSegmentAudio = false;" 
                       onblur="window.isUserEditingActiveCell = false;" 
                       oninput="modifySegmentTimeCoordinates(${i}, 'start', this.value)">
                <input type="number" step="0.1" value="${marker.end}" 
                       onfocus="window.isUserEditingActiveCell = true; window.isTestingSegmentAudio = false;" 
                       onblur="window.isUserEditingActiveCell = false;" 
                       oninput="modifySegmentTimeCoordinates(${i}, 'end', this.value)">
                <input type="text" placeholder="Verse fragment text" value="${marker.text.replace(/"/g, '&quot;')}" 
                       onfocus="window.isUserEditingActiveCell = true; window.isTestingSegmentAudio = false;" 
                       onblur="window.isUserEditingActiveCell = false;" 
                       oninput="modifySegmentTextString(${i}, this.value)">
                <label class="checkbox-label">
                    <input type="checkbox" ${marker.forceEndBlock ? 'checked' : ''} onchange="toggleSegmentBlockBoundary(${i}, this.checked)"> Break
                </label>
                <div style="display:flex; gap:3px; margin-left:auto;">
                   <!-- <button class="btn btn-primary" style="padding:4px 8px; font-size:11px;" onclick="snapSegmentBoundaryToPlaybackTime(${i})">Snap</button> -->
                    <button class="btn btn-success" style="padding:4px 8px; font-size:11px;" onclick="testSegmentAudioPlaybackInterval(${i})">▶</button>
                    <button class="btn btn-danger" style="padding:4px 8px; font-size:11px;" onclick="deleteSegmentRow(${i})">×</button>
                </div>
            </div>`;
            }).join('');

            document.getElementById('status').innerText = `Markers: ${window.rawMarkers.length}`;
            renderRunningLiveHighlightViewer(currentHighlightIndex);
        }

        function modifySegmentTextString(index, val) {
            if (window.rawMarkers[index]) {
                window.rawMarkers[index].text = val;
                renderRunningLiveHighlightViewer(currentHighlightIndex);
            }
        }

        function modifySegmentTimeCoordinates(index, field, value) {
            if (!window.rawMarkers[index]) return;

            const parsedNum = parseFloat(value);
            if (isNaN(parsedNum)) return;

            const originalVal = window.rawMarkers[index][field];
            const deltaOffset = parsedNum - originalVal;

            window.rawMarkers[index][field] = parsedNum;

            // Maintain back-to-back continuity with immediate neighbors
            if (field === 'start' && window.rawMarkers[index - 1]) {
                window.rawMarkers[index - 1].end = parsedNum;
            }
            if (field === 'end' && window.rawMarkers[index + 1]) {
                window.rawMarkers[index + 1].start = parsedNum;
            }

            // Only cascade the shift down the timeline if the ripple checkbox is enabled
            const shouldRipple = document.getElementById('rippleTimeAdjustmentsToggle').checked;

            if (deltaOffset !== 0 && shouldRipple && !isSystemImportingData && window.isUserEditingActiveCell) {
                for (let i = index + 1; i < window.rawMarkers.length; i++) {
                    let targetEnd = parseFloat((window.rawMarkers[i].end + deltaOffset).toFixed(1));
                    window.rawMarkers[i].end = targetEnd;
                    window.rawMarkers[i].start = window.rawMarkers[i - 1].end;
                }
            }

            // Enforce maximum track boundary safety ceiling safely
            const lastIdx = window.rawMarkers.length - 1;
            if (window.rawMarkers[lastIdx].end > detectedDuration && detectedDuration > 0) {
                window.rawMarkers[lastIdx].end = parseFloat(detectedDuration.toFixed(1));
            }

            renderTimelineGridCanvas(false);
            if (!isSystemImportingData) {
                serializeWorkspaceStateToJsCodeblock();
            }
        }

        function toggleSegmentBlockBoundary(index, isChecked) {
            if (window.rawMarkers[index]) {
                window.rawMarkers[index].forceEndBlock = isChecked;
                serializeWorkspaceStateToJsCodeblock();
            }
        }

        // function snapSegmentBoundaryToPlaybackTime(index) {
        //     const time = player.currentTime;
        //     window.rawMarkers[index].end = parseFloat(time.toFixed(1));
        //     if (window.rawMarkers[index + 1]) window.rawMarkers[index + 1].start = parseFloat(time.toFixed(1));
        //     renderTimelineGridCanvas(false);
        //     serializeWorkspaceStateToJsCodeblock();
        // }

        function captureLiveTimestamp() {
            const time = parseFloat(player.currentTime.toFixed(1));
            for (let i = 0; i < window.rawMarkers.length; i++) {
                if (time > window.rawMarkers[i].start && time < window.rawMarkers[i].end) {
                    window.rawMarkers[i].end = time;
                    if (window.rawMarkers[i + 1]) window.rawMarkers[i + 1].start = time;
                    break;
                }
            }
            renderTimelineGridCanvas(true);
            serializeWorkspaceStateToJsCodeblock();
        }

        function insertMidpointSegmentRow(index) {
            const segment = window.rawMarkers[index];
            if (!segment) return;

            const midpoint = parseFloat(((segment.start + segment.end) / 2).toFixed(1));
            const boundaryEndVal = segment.end;

            segment.end = midpoint;

            const addedRecord = {
                start: midpoint,
                end: boundaryEndVal,
                text: "",
                pIndex: segment.pIndex,
                forceEndBlock: segment.forceEndBlock,
                origStep2: null, origStep3: null, origStep4: null
            };

            segment.forceEndBlock = false;
            window.rawMarkers.splice(index + 1, 0, addedRecord);

            renderTimelineGridCanvas(true);
            serializeWorkspaceStateToJsCodeblock();

            setTimeout(() => {
                const targetRow = document.getElementById(`item-${index + 1}`);
                if (targetRow) {
                    const txt = targetRow.querySelector('input[type="text"]');
                    if (txt) txt.focus({ preventScroll: true });
                    focusRowScrollHighlight(index + 1);
                }
            }, 50);
        }

        function deleteSegmentRow(index) {
            if (!(confirm("Do you want to delete this segment?"))) return;

            if (window.rawMarkers.length <= 1) return;
            const deleted = window.rawMarkers[index];

            if (index > 0) {
                window.rawMarkers[index - 1].end = deleted.end;
                if (deleted.forceEndBlock) window.rawMarkers[index - 1].forceEndBlock = true;
            } else if (window.rawMarkers[index + 1]) {
                window.rawMarkers[index + 1].start = deleted.start;
            }

            window.rawMarkers.splice(index, 1);
            renderTimelineGridCanvas(true);
            serializeWorkspaceStateToJsCodeblock();
        }

        function reproportionalizeTimelineDist() {
            if (window.rawMarkers.length === 0) return;
            let len = detectedDuration || 300;
            let step = len / window.rawMarkers.length;
            window.rawMarkers.forEach((m, i) => {
                m.start = parseFloat((i * step).toFixed(1));
                m.end = (i === window.rawMarkers.length - 1) ? parseFloat(len.toFixed(1)) : parseFloat(((i + 1) * step).toFixed(1));
            });
            renderTimelineGridCanvas(true);
            serializeWorkspaceStateToJsCodeblock();
        }

        function testSegmentAudioPlaybackInterval(id) {
            const m = window.rawMarkers[id];
            if (!m) return;

            window.isTestingSegmentAudio = true;
            currentHighlightIndex = id;
            focusRowScrollHighlight(id);

            player.currentTime = m.start;
            player.play();

            if (window.segmentPlaybackIntervalHandle) clearInterval(window.segmentPlaybackIntervalHandle);

            window.segmentPlaybackIntervalHandle = setInterval(() => {
                if (player.currentTime >= m.end) {
                    player.pause();
                    clearInterval(window.segmentPlaybackIntervalHandle);
                    window.isTestingSegmentAudio = false;

                    // Advance focus pointer automatically here too
                    const nextIndex = id + 1;
                    if (nextIndex < window.rawMarkers.length) {
                        currentHighlightIndex = nextIndex;
                        focusRowScrollHighlight(nextIndex);
                        player.currentTime = window.rawMarkers[nextIndex].start;
                    }
                }
            }, 20);
        }

        function renderRunningLiveHighlightViewer(activeIndex) {
            if (!livePasuramView) return;
            if (window.rawMarkers.length === 0) {
                livePasuramView.innerHTML = `<em>Load assets to generate dynamic highlighter canvas...</em>`;
                return;
            }

            let html = window.rawMarkers.map((marker, i) => {
                let cssClass = (i === activeIndex) ? 'class="active-phrase"' : 'class="normal-phrase"';
                return `<span ${cssClass} id="text-phrase-${i}">${marker.text}</span>${marker.forceEndBlock ? '<br><hr>' : ' * '}`;
            });
            livePasuramView.innerHTML = html.join('');
        }

        function focusRowScrollHighlight(index) {
            document.querySelectorAll('.marker-item').forEach(el => el.style.background = '#ffffff');
            let row = document.getElementById(`item-${index}`);
            if (row) {
                row.style.background = '#eff6ff';
                let midPointScroll = row.offsetTop - markerList.offsetTop - (markerList.clientHeight / 2) + (row.offsetHeight / 2);
                markerList.scrollTo({ top: Math.max(0, midPointScroll), behavior: 'smooth' });
            }
            renderRunningLiveHighlightViewer(index);
        }

        function setupGlobalSyncLoop() {
            const monitor = () => {
                let curr = player ? player.currentTime : 0;
                let idx = window.rawMarkers.findIndex(m => curr >= m.start && curr < m.end);

                if (idx !== -1 && idx !== currentHighlightIndex && !window.isUserEditingActiveCell) {
                    currentHighlightIndex = idx;
                    focusRowScrollHighlight(idx);
                }

                const timerElement = document.getElementById('timeDisplay');
                if (timerElement) timerElement.innerText = curr.toFixed(1) + 's';
                requestAnimationFrame(monitor);
            };
            requestAnimationFrame(monitor);
        }

        /**
         * Distribute n items into 4 groups.
         * Start from [2,2,2,2]=8. Subtract deficit from inner positions first (2,1,0), outer last (3).
         * n=8→[2,2,2,2], n=7→[2,2,1,2], n=6→[2,1,1,2], n=5→[1,1,1,2], n=4→[1,1,0,2]...
         * For n<4 collapses gracefully.
         */
        function distributeInto4(n) {
            // Start from [2,2,2,2]=8, subtract 1 at a time cycling through positions 2,1,0,3
            // n=8→[2,2,2,2], n=7→[2,2,1,2], n=6→[2,1,1,2], n=5→[1,1,1,2]
            const g = [2, 2, 2, 2];
            const order = [2, 1, 0, 3];
            let deficit = 8 - n;
            while (deficit > 0) {
                for (const pos of order) {
                    if (deficit <= 0) break;
                    if (g[pos] > 0) { g[pos]--; deficit--; }
                }
            }
            return g;
        }

        /** Build step2: merge step1 segments according to 4-group distribution */
        function buildStep2(step1) {
            const n = step1.length;
            if (n === 0) return [];
            const groups = distributeInto4(n);
            const step2 = [];
            let idx = 0;
            for (const size of groups) {
                if (size === 0) continue;
                const slice = step1.slice(idx, idx + size);
                step2.push([slice[0][0], slice[slice.length - 1][1]]);
                idx += size;
            }
            return step2;
        }

        /** Build step3: pair up step2 entries (groups of 2) */
        function buildStep3(step2) {
            const step3 = [];
            for (let i = 0; i < step2.length; i += 2) {
                const a = step2[i];
                const b = step2[i + 1];
                step3.push([a[0], b ? b[1] : a[1]]);
            }
            return step3;
        }

        function serializeWorkspaceStateToJsCodeblock() {
            if (!ioJson || window.rawMarkers.length === 0) return;

            // Save active workspace memory array and metadata directly to local storage
            localStorage.setItem('asm_saved_markers', JSON.stringify(window.rawMarkers));
            localStorage.setItem('asm_current_filename', currentFileName);

            let timelineBlocks = [];
            let textBlocks = {};

            let groupedByP = {};
            window.rawMarkers.forEach(m => {
                let p = m.pIndex || 1;
                if (!groupedByP[p]) groupedByP[p] = [];
                groupedByP[p].push(m);
            });

            Object.keys(groupedByP).sort((a, b) => parseInt(a) - parseInt(b)).forEach(pKey => {
                let activeGroup = groupedByP[pKey];
                let step1 = activeGroup.map(seg => [parseFloat(seg.start.toFixed(1)), parseFloat(seg.end.toFixed(1))]);

                // Always recompute steps 2/3/4 from step1 so edits propagate correctly.
                const step2 = buildStep2(step1);
                const step3 = buildStep3(step2);
                const step4 = [step1[0][0], step1[step1.length - 1][1]];

                timelineBlocks.push({
                    p: parseInt(pKey),
                    step1: step1, step2: step2, step3: step3, step4: step4
                });

                let combinedPhrases = [];
                for (let pIdx = 0; pIdx < activeGroup.length; pIdx++) {
                    let txt = activeGroup[pIdx].text.trim();
                    if (pIdx > 0) combinedPhrases.push(' * ');
                    combinedPhrases.push(txt);
                }
                textBlocks[pKey] = combinedPhrases.join('') + ' *';
            });

            let lines = timelineBlocks.map(b => `  { "p": ${b.p}, "step1": ${JSON.stringify(b.step1)}, "step2": ${JSON.stringify(b.step2)}, "step3": ${JSON.stringify(b.step3)}, "step4": ${JSON.stringify(b.step4)} }`);
            let txtLines = Object.keys(textBlocks).map(k => `    ${k}: ${JSON.stringify(textBlocks[k])}`);

            ioJson.value = `window.MARKER_DATABASE = window.MARKER_DATABASE || {};\n\n` +
                `window.MARKER_DATABASE['${currentFileName}'] = [\n${lines.join(",\n")}\n];\n\n` +
                `// COMPANION TEXT DICTIONARY BUNDLE\n` +
                `const text_bundle_ta = {\n  '${currentFileName}': {\n${txtLines.join(",\n")}\n  }\n};`;
        }

        function importFromRawConfigSnippet() {
            const raw = ioJson.value.trim();
            if (!raw) return;

            try {
                const arrayStart = raw.indexOf('[');
                const arrayEnd = raw.lastIndexOf(']');
                if (arrayStart === -1 || arrayEnd === -1) throw new Error("Could not detect top-level array anchors.");

                let cleanJsonStr = raw.substring(arrayStart, arrayEnd + 1)
                    .replace(/,\s*([\]}])/g, '$1')
                    .replace(/,\s*\n\s*([\]}])/g, '$1');
                const parsedBlocks = JSON.parse(cleanJsonStr);

                if (!Array.isArray(parsedBlocks)) throw new Error("Target node payload is not an explicit matrix array configuration.");

                let imported = [];
                parsedBlocks.forEach((block) => {
                    const step1 = block.step1 || [];
                    const currentStep2 = block.step2 ? JSON.parse(JSON.stringify(block.step2)) : null;
                    const currentStep3 = block.step3 ? JSON.parse(JSON.stringify(block.step3)) : null;
                    const currentStep4 = block.step4 ? JSON.parse(JSON.stringify(block.step4)) : null;

                    for (let i = 0; i < step1.length; i++) {
                        imported.push({
                            start: parseFloat(step1[i][0]),
                            end: parseFloat(step1[i][1]),
                            text: `Verse Fragment Node Row [P.${block.p || 1} #${i + 1}]`,
                            pIndex: block.p || 1,
                            forceEndBlock: (i === step1.length - 1),
                            origStep2: i === 0 ? currentStep2 : null,
                            origStep3: i === 0 ? currentStep3 : null,
                            origStep4: i === 0 ? currentStep4 : null
                        });
                    }
                });

                isSystemImportingData = true;
                window.rawMarkers = imported;
                renderTimelineGridCanvas(true);
                serializeWorkspaceStateToJsCodeblock();
                isSystemImportingData = false;
                alert(`Successfully mounted canvas timeline using ${window.rawMarkers.length} structural entries.`);
            } catch (e) { alert("Import Fault: " + e.message); }
        }

        function rewindPlayback() { player.currentTime = Math.max(0, player.currentTime - 2); }

        function clearWorkspaceState() {
            if (confirm("Clear active canvas context?")) {
                // Wipe local storage backup registers completely
                localStorage.removeItem('asm_saved_markers');
                localStorage.removeItem('asm_current_filename');

                window.rawMarkers = [];
                window.MARKER_DATABASE = {};
                if (window.text_bundle_ta) window.text_bundle_ta = {};

                document.getElementById('audioUrlInput').value = '';
                document.getElementById('textUrlInput').value = '';
                document.getElementById('stepsUrlInput').value = '';

                const fileInputs = document.querySelectorAll('input[type="file"]');
                fileInputs.forEach(input => input.value = '');

                document.getElementById('pipelineKeySelectorContainer').style.display = 'none';

                markerList.innerHTML = `
                    <div style="text-align:center; color:#94a3b8; padding:50px 0;">
                        Workspace clear. Ingest asset configurations to populate interactive canvas grids.
                    </div>
                `;

                document.getElementById('status').innerText = "Markers: 0";
                renderRunningLiveHighlightViewer(-1);
                ioJson.value = '';

                if (player) {
                    player.pause();
                    player.src = '';
                }
            }
        }
    </script>
