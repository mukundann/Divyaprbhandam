<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Prabandham Learning Tool - PTM Canto 2</title>
    <script src="marker.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcfcfc;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eef0f2;
        }
        h2 {
            color: #1a365d;
            text-align: center;
            margin-top: 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .control-panel {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label {
            font-weight: 600;
            font-size: 14px;
            color: #4a5568;
        }
        select, button {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #cbd5e0;
            background-color: #fff;
            cursor: pointer;
            outline: none;
        }
        select:focus, button:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
        }
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            font-weight: 500;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .display-box {
            background: #fffaf0;
            border: 1px solid #feebc8;
            border-radius: 6px;
            padding: 20px;
            min-height: 120px;
            margin-top: 20px;
            text-align: center;
        }
        .status-text {
            font-size: 14px;
            color: #718096;
            margin-bottom: 8px;
        }
        .timeline-info {
            font-family: monospace;
            font-size: 13px;
            color: #a0aec0;
            margin-top: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Perumal Thirumozhi - Decad 2 Practice</h2>

    <div class="control-panel">
        <div class="control-group">
            <label for="learningStepDropdown">Learning Mode:</label>
            <select id="learningStepDropdown" onchange="onLearningStepChange(this)">
                <option value="1" selected>Step 1: Half-Line Segments</option>
                <option value="2">Step 2: Full-Line Segments</option>
                <option value="3">Step 3: Two-Line Segments</option>
                <option value="4">Step 4: Full Pasuram Practice</option>
            </select>
        </div>

        <div class="control-group">
            <button onclick="synchronizePlaybackEngine()">Sync Track</button>
        </div>
    </div>

    <audio id="audioPlayer" controls src="PTM2.mp3"></audio>

    <div class="display-box">
        <div class="status-text" id="statusDisplay">Initializing engine...</div>
        <div id="timelineDump" class="timeline-info"></div>
    </div>
</div>

<script>
// =========================================================
// 1. GLOBAL TRACKING VARIABLES (Original Compatibility)
// =========================================================
let markers = [];              // Global layout marker array required by legacy loops
let currentLearningStep = 1;   // Selected step type indicator (1 to 4)

// Reference media element hooks
const audioPlayer = document.getElementById('audioPlayer');
const statusDisplay = document.getElementById('statusDisplay');
const timelineDump = document.getElementById('timelineDump');

// =========================================================
// 2. RUNTIME TIMELINE FLATTENING ENGINE
// =========================================================
/**
 * Processes matrix chunks of the whole decad block into a combined linear 
 * chronological array that fits the legacy player requirements.
 */
function compileDecadTimeline(fullCantoData, step) {
    const combinedTimelineArray = [];
    
    fullCantoData.forEach((pasuramNode) => {
        let sourcePool = [];
        
        switch (step) {
            case 1: sourcePool = pasuramNode.step1; break;
            case 2: sourcePool = pasuramNode.step2; break;
            case 3: sourcePool = pasuramNode.step3; break;
            case 4: sourcePool = pasuramNode.step4; break;
            default: sourcePool = pasuramNode.step1;
        }
        
        sourcePool.forEach((segment, sliceIndex) => {
            combinedTimelineArray.push(segment[0]);
            // Capture the absolute terminating boundary marker of this node block
            if (sliceIndex === sourcePool.length - 1) {
                combinedTimelineArray.push(segment[1]);
            }
        });
    });

    // De-duplicate any perfectly overlapping boundary seams (e.g. 18.77 trailing vs leading)
    return [...new Set(combinedTimelineArray)].sort((a, b) => a - b);
}

/**
 * Reconfigures global marker arrays and alerts the tracking loops.
 */
function synchronizePlaybackEngine() {
    // Check if external data is ready
    if (typeof PTM_2_DATA === 'undefined') {
        statusDisplay.innerText = "Error: PTM_2_DATA missing from marker.js";
        return;
    }

    // Generate full contiguous map for the complete structural track
    markers = compileDecadTimeline(PTM_2_DATA, currentLearningStep);
    
    // Update display metrics view
    statusDisplay.innerText = `Active Learning Mode: Step ${currentLearningStep} (Contiguous Decad)`;
    timelineDump.innerText = `Current Legacy Active Marker Array: [${markers.join(', ')}]`;
    
    // Safety check: reset playback to start if timeline initializes out-of-bounds
    if (markers.length > 0 && audioPlayer.currentTime < markers[0]) {
        audioPlayer.currentTime = markers[0];
    }
}

// =========================================================
// 3. INTERFACE DOM EVENT HANDLERS
// =========================================================
function onLearningStepChange(selectNode) {
    currentLearningStep = parseInt(selectNode.value, 10);
    synchronizePlaybackEngine();
}

// Initialize complete structural timeline array boundaries when DOM renders safely
window.addEventListener('DOMContentLoaded', () => {
    synchronizePlaybackEngine();
});
</script>

</body>
</html>
