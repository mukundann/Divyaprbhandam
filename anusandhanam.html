<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Divya Prabandham Anusandhanam</title>
    <style>
        /* Modern Flexible Page Alignment Context */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 16px; 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* The Card fluidly scales from small mobile screens up to wide laptops */
        .card { 
            background: white; 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); 
            width: 100%; 
            max-width: 680px; /* Wider footprint to allow two-column arrangements on laptops */
            box-sizing: border-box;
        }
        
        h2 { text-align: center; color: #1c1e21; margin-top: 0; margin-bottom: 20px; font-size: 1.4rem; font-weight: 700; }
        .input-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: #4b4f56; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
        
        /* 16px Font baseline rules out intrusive viewport focus zooming on iOS/Android */
        select, input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccd0d5; 
            border-radius: 10px; 
            font-size: 16px; 
            box-sizing: border-box; 
            background-color: #fff;
            color: #1c1e21;
            height: 48px;
        }
        select:focus, input:focus {
            border-color: #0070ba;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 112, 186, 0.15);
        }
        
        /* Dual Mode Grid Layout: Becomes 2 column side-by-side on Laptop screens, 1 column on Mobile */
        .config-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0px;
        }
        
        .learning-controls { background: #f9fafb; border: 1px solid #e4e6eb; padding: 16px; border-radius: 12px; margin: 16px 0; }
        .flex-row { display: flex; gap: 12px; align-items: center; }
        
        /* High Performance Navigation Footprints */
        .nav-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 20px; }
        button { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 48px; 
            border: none; 
            border-radius: 10px; 
            font-size: 0.95rem;
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.15s, transform 0.1s; 
            user-select: none;
            touch-action: manipulation;
        }
        button:active { transform: scale(0.98); }
        .btn-play { background-color: #0070ba; color: white; grid-column: span 3; font-size: 1rem; height: 52px; }
        .btn-play:hover { background-color: #005a96; }
        .btn-nav { background-color: #e4e6eb; color: #050505; }
        .btn-nav:hover { background-color: #d8dadf; }
        
        audio { width: 100%; margin-top: 20px; border-radius: 8px; }
        .status { margin-top: 14px; font-size: 0.75rem; color: #0070ba; text-align: center; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        
        /* Dynamic fluid text layout panel */
        .pasuram-text-panel {
            background: #fffdf2;
            border: 1px solid #f6e58d;
            padding: 18px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 1.25rem; /* Larger text scales smoothly on laptop monitors */
            line-height: 1.6;
            color: #2c3e50;
            text-align: center;
            box-sizing: border-box;
            word-wrap: break-word;
            overflow-wrap: break-word;
            min-height: 80px;
            max-height: 160px;
            overflow-y: auto;
        }
        .pasuram-text-panel span.active-segment {
            font-weight: 700;
            color: #000000;
            background-color: #fbe251;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin: 2px 0;
        }
        .pasuram-text-panel span.normal-segment {
            font-weight: 400;
            display: inline-block;
            margin: 2px 0;
        }

        /* LAPTOP MEDIA QUERY: Adjusts the layout structures dynamically when display widths expand */
        @media (min-width: 580px) {
            .config-grid {
                grid-template-columns: 1fr 1fr;
                gap: 16px;
                margin-bottom: 4px;
            }
            .learning-controls {
                margin: 0;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
            .pasuram-text-panel {
                max-height: 220px; /* Gives verse text wider structural area on wide laptop viewports */
                font-size: 1.35rem;
                padding: 22px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Anusandhanam Player</h2>
    
    <div class="config-grid">
        <div>
            <div class="input-group">
                <label>Select Prabandham</label>
                <select id="prefix" onchange="resetToStart()">
                    <option value="TVM">Thiruvaimozhi (TVM)</option>
                    <option value="PT">Periya Thirumozhi (PT)</option>
                    <option value="PMT">Perumal Thirumozhi (PMT)</option>
                    <option value="NAT">Naachiyar Thirumozhi (NAT)</option>
                </select>
            </div>
            <div class="input-group" style="margin-bottom: 0;">
                <label id="numLabel">Current Pasuram (Ch.Sub.Pas)</label>
                <input type="text" id="number" value="1.1.1" inputmode="decimal">
            </div>
        </div>

        <div class="learning-controls">
            <div class="flex-row">
                <div style="flex: 1;"><label>Repeat</label><input type="number" id="repeatLimit" value="1" min="1"></div>
                <div style="flex: 2;"><label>Auto-Advance</label>
                    <select id="autoNext"><option value="true">Yes</option><option value="false">No</option></select>
                </div>
            </div>
            <div style="margin-top: 10px;">
                <label>Learning Mode</label>
                <select id="learningStep" onchange="resetLineTracking()">
                    <option value="step1">Step 1: Half-Line Segments</option>
                    <option value="step2" selected>Step 2: Full-Line Segments</option>
                    <option value="step3">Step 3: Two-Line Segments</option>
                    <option value="step4">Step 4: Full Pasuram Practice</option>
                </select>
            </div>
            <div style="margin-top: 10px; display: none;">
                <select id="recitationFocus"><option value="both" selected>Play Both</option></select>
            </div>
        </div>
    </div>

    <div id="pasuramDisplay" class="pasuram-text-panel">
        <em>Select a file or press start to view pasuram lines...</em>
    </div>

    <div class="nav-controls">
        <button class="btn-play" onclick="startLearning()">START RECITATION</button>
        <button class="btn-nav" onclick="navigate(-1)">Prev</button>
        <button class="btn-nav" onclick="safeStopAudio()">Stop</button> 
        <button class="btn-nav" onclick="navigate(1)">Next</button>
    </div>
    <audio id="audioPlayer" controls></audio>
    <div id="status" class="status">Ready</div>
</div>

<script src="marker.js"></script>
<script src="markerProcessor.js"></script>
<script src="config.js"></script>
<script src="navigation.js"></script>
<script src="learningEngine.js"></script>

<script>
    let activeLineIndex = 0;
    let pauseTimeoutHandle = null;

    document.addEventListener('DOMContentLoaded', () => {
        const audioPlayer = document.getElementById('audioPlayer');
        if (audioPlayer) {
            LearningEngine.init(audioPlayer);
        }

        setupLiveTextSyncLoop();

        window.addEventListener('learning-track-ended', () => {
            const limit = parseInt(document.getElementById('repeatLimit').value, 10);
            LearningEngine.state.currentRepeatCount++;
            
            const chosenStep = document.getElementById('learningStep').value;
            let pauseDuration = 0;

            if (LearningEngine.state.currentRepeatCount >= limit && chosenStep === 'step1') {
                pauseDuration = 500;
            }

            const proceedToNextPlay = () => {
                if (LearningEngine.state.currentRepeatCount < limit) {
                    startLearning();
                } else {
                    LearningEngine.state.currentRepeatCount = 0;
                    
                    const pre = document.getElementById('prefix').value;
                    const numInput = document.getElementById('number').value;
                    const c = CONFIG[pre];
                    const coords = Navigation.parseCoords(numInput, c.hasSub);
                    
                    const stepsDatabaseBlock = window.MARKER_DATABASE[`${pre}.${coords.ch}.steps`] || window.MARKER_DATABASE['PTM_2_DATA'];

                    if (stepsDatabaseBlock && stepsDatabaseBlock[coords.pas - 1]) {
                        const targetPasuram = stepsDatabaseBlock[coords.pas - 1];
                        const activeSegments = targetPasuram[chosenStep] || targetPasuram["step2"];
                        
                        if (chosenStep !== "step4" && activeLineIndex < activeSegments.length - 1) {
                            activeLineIndex++;
                            startLearning();
                            return;
                        }
                    }

                    activeLineIndex = 0;
                    if (document.getElementById('autoNext').value === "true") {
                        navigate(1);
                    } else {
                        safeStopAudio();
                    }
                }
            };

            if (pauseDuration > 0) {
                document.getElementById('status').innerText = "Pausing...";
                if (pauseTimeoutHandle) clearTimeout(pauseTimeoutHandle);
                pauseTimeoutHandle = setTimeout(proceedToNextPlay, pauseDuration);
            } else {
                proceedToNextPlay();
            }
        });
    });

    function setupLiveTextSyncLoop() {
        const monitorPlaybackTime = () => {
            const playerEl = document.getElementById('audioPlayer');
            const displayPanel = document.getElementById('pasuramDisplay');
            
            if (playerEl && displayPanel && window.MARKER_DATABASE) {
                const pre = document.getElementById('prefix').value;
                const numInput = document.getElementById('number').value;
                
                if (CONFIG[pre]) {
                    const coords = Navigation.parseCoords(numInput, CONFIG[pre].hasSub);
                    const stepsKey = `${pre}.${coords.ch}.steps`;
                    const stepsDatabaseBlock = window.MARKER_DATABASE[stepsKey] || window.MARKER_DATABASE['PTM_2_DATA'];
                    
                    if (stepsDatabaseBlock && stepsDatabaseBlock[coords.pas - 1]) {
                        const targetPasuram = stepsDatabaseBlock[coords.pas - 1];
                        const rawTextString = targetPasuram.text || "";
                        
                        if (rawTextString) {
                            let textPhrases = rawTextString.split(' *');
                            if (textPhrases[textPhrases.length - 1].trim() === "") textPhrases.pop();
                            
                            const step1Timeline = targetPasuram["step1"] || [];
                            const currentTime = playerEl.currentTime;
                            
                            let matchIndex = -1;
                            for (let i = 0; i < step1Timeline.length; i++) {
                                if (currentTime >= step1Timeline[i][0] && currentTime <= step1Timeline[i][1]) {
                                    matchIndex = i;
                                    break;
                                }
                            }
                            
                            let innerHTMLString = [];
                            for (let j = 0; j < textPhrases.length; j++) {
                                const cleanPhrase = textPhrases[j].trim();
                                if (j === matchIndex) {
                                    innerHTMLString.push(`<span class="active-segment">${cleanPhrase}</span>`);
                                } else {
                                    innerHTMLString.push(`<span class="normal-segment">${cleanPhrase}</span>`);
                                }
                                
                                if (j < textPhrases.length - 1) {
                                    innerHTMLString.push(` <span style="color:#ccbf99;">*</span> `);
                                }
                            }
                            
                            if (displayPanel.dataset.lastSignature !== `${matchIndex}_${coords.pas}_${pre}`) {
                                displayPanel.innerHTML = innerHTMLString.join('');
                                displayPanel.dataset.lastSignature = `${matchIndex}_${coords.pas}_${pre}`;
                            }
                        }
                    }
                }
            }
            requestAnimationFrame(monitorPlaybackTime);
        };
        requestAnimationFrame(monitorPlaybackTime);
    }

    function startLearning() {
        if (pauseTimeoutHandle) clearTimeout(pauseTimeoutHandle);
        
        const pre = document.getElementById('prefix').value;
        const numInput = document.getElementById('number').value;
        const chosenStep = document.getElementById('learningStep').value;
        const focusMode = document.getElementById('recitationFocus').value;
        const c = CONFIG[pre];
        const coords = Navigation.parseCoords(numInput, c.hasSub);
        const isSingle = typeof c.isSingleFile === 'function' ? c.isSingleFile(numInput) : c.isSingleFile;
        
        let bounds = null;
        let lineWindows = null;

        if (isSingle) {
            const oldKey = `${pre}.${coords.ch}.all`;
            const stepsKey = `${pre}.${coords.ch}.steps`;
            
            const oldDatabaseBlock = window.MARKER_DATABASE[oldKey];
            const stepsDatabaseBlock = window.MARKER_DATABASE[stepsKey] || window.MARKER_DATABASE['PTM_2_DATA'];
            
            if (stepsDatabaseBlock && stepsDatabaseBlock[coords.pas - 1]) {
                const targetPasuram = stepsDatabaseBlock[coords.pas - 1];
                lineWindows = targetPasuram["step2"] || null;
                
                if (chosenStep === "step4") {
                    const fullBounds = targetPasuram["step4"] ? targetPasuram["step4"][0] : null;
                    if (fullBounds) {
                        bounds = { start: fullBounds[0], end: fullBounds[1] };
                    } else if (lineWindows && lineWindows.length > 0) {
                        bounds = { start: lineWindows[0][0], end: lineWindows[lineWindows.length - 1][1] };
                    } else {
                        bounds = { start: 0, end: 0 };
                    }
                    document.getElementById('status').innerText = `Full Pasuram Recitation`;
                } else {
                    const activeSegments = targetPasuram[chosenStep] || targetPasuram["step2"];
                    if (activeSegments && activeSegments.length > 0) {
                        if (activeLineIndex >= activeSegments.length) activeLineIndex = 0;
                        const targetPair = activeSegments[activeLineIndex];
                        bounds = { start: targetPair[0], end: targetPair[1] };
                        document.getElementById('status').innerText = `Playing Phrase ${activeLineIndex + 1} of ${activeSegments.length}`;
                    }
                }
            } else if (oldDatabaseBlock) {
                activeLineIndex = 0;
                bounds = MarkerProcessor.getSegmentBounds(oldDatabaseBlock, coords.pas - 1);
                document.getElementById('status').innerText = `Playing Complete Pasuram ${coords.pas}`;
            }
        }

        LearningEngine.playSegment(c.getAudioSrc(numInput), bounds, () => {
            window.dispatchEvent(new CustomEvent('learning-track-ended'));
        }, lineWindows, chosenStep, focusMode);
    }

    function safeStopAudio() {
        if (pauseTimeoutHandle) clearTimeout(pauseTimeoutHandle);
        if (window.LearningEngine) {
            LearningEngine.stopMonitor();
            if (LearningEngine.state && LearningEngine.state.player) {
                LearningEngine.state.player.pause();
            }
        }
        document.getElementById('status').innerText = "Ready";
    }

    function handleLiveFocusChange() {
        const chosenStep = document.getElementById('learningStep').value;
        if (chosenStep === "step4" && window.LearningEngine && LearningEngine.state.player && !LearningEngine.state.player.paused) {
            startLearning();
        }
    }

    function navigate(dir) {
        if (pauseTimeoutHandle) clearTimeout(pauseTimeoutHandle);
        
        safeStopAudio(); 
        resetLineTracking();

        const input = document.getElementById('number');
        const pre = document.getElementById('prefix').value;
        const c = CONFIG[pre];
        let coords = Navigation.parseCoords(input.value, c.hasSub);
        
        coords.pas += dir;
        const limit = Navigation.getLimit(pre, coords.ch, coords.sub);

        if (dir === 1 && coords.pas > limit) {
            coords.pas = 1;
            if (c.hasSub) { coords.sub++; if (coords.sub > c.maxSub) { coords.sub = 1; coords.ch++; } }
            else { coords.ch++; }
        } else if (dir === -1 && coords.pas < 1) {
            coords.pas = 1;
        }

        input.value = c.hasSub ? `${coords.ch}.${coords.sub}.${coords.pas}` : `${coords.ch}.${coords.pas}`;
        startLearning();
    }

    function resetLineTracking() {
        activeLineIndex = 0;
        if (window.LearningEngine && LearningEngine.state) {
            LearningEngine.state.currentRepeatCount = 0;
        }
    }

    function resetToStart() {
        safeStopAudio();
        resetLineTracking();
        const pre = document.getElementById('prefix').value;
        document.getElementById('number').value = CONFIG[pre].hasSub ? "1.1.1" : "1.1";
    }
</script>
</body>
</html>
