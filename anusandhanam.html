<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Prabandham Learning Tool - PTM Canto 2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcfcfc;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eef0f2;
        }
        h2 {
            color: #1a365d;
            text-align: center;
            margin-top: 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .control-panel {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label {
            font-weight: 600;
            font-size: 14px;
            color: #4a5568;
        }
        select, button {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #cbd5e0;
            background-color: #fff;
            cursor: pointer;
            outline: none;
        }
        select:focus, button:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
        }
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            font-weight: 500;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .display-box {
            background: #fffaf0;
            border: 1px solid #feebc8;
            border-radius: 6px;
            padding: 20px;
            min-height: 120px;
            margin-top: 20px;
            text-align: center;
        }
        .status-text {
            font-size: 14px;
            color: #718096;
            margin-bottom: 8px;
        }
        .timeline-info {
            font-family: monospace;
            font-size: 13px;
            color: #a0aec0;
            margin-top: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Perumal Thirumozhi - Decad 2 Practice</h2>

    <div class="control-panel">
        <div class="control-group">
            <label for="pasuramDropdown">Pasuram:</label>
            <select id="pasuramDropdown" onchange="onPasuramChange(this)">
                <option value="0">Pasuram 1 (தேட்டிறல்வளநாடன்)</option>
                <option value="1">Pasuram 2 (ஆனாத செல்வத்து)</option>
                <option value="2">Pasuram 3 (வேரியார் பொழில்சூழ்)</option>
                <option value="3">Pasuram 4 (கொம்பார்ந்த வேக)</option>
                <option value="4">Pasuram 5 (வான்ஆளும் மாமதிபோல்)</option>
                <option value="5">Pasuram 6 (மன்னிய தண்சாரல்)</option>
                <option value="6">Pasuram 7 (இம்பவான் நாட்டோடு)</option>
                <option value="7">Pasuram 8 (செடியாய வல்வினைகள்)</option>
                <option value="8">Pasuram 9 (பினியவிழும் பூஞ்சோலை)</option>
                <option value="9">Pasuram 10 (நன்னெறிஆவது ஏதும்)</option>
                <option value="10">Pasuram 11 (மலிந்துவரும் சீர்ப்பிறதி)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="learningStepDropdown">Learning Mode:</label>
            <select id="learningStepDropdown" onchange="onLearningStepChange(this)">
                <option value="1" selected>Step 1: Half-Line Segments</option>
                <option value="2">Step 2: Full-Line Segments</option>
                <option value="3">Step 3: Two-Line Segments</option>
                <option value="4">Step 4: Full Pasuram Practice</option>
            </select>
        </div>

        <div class="control-group">
            <button onclick="synchronizePlaybackEngine()">Sync Track</button>
        </div>
    </div>

    <audio id="audioPlayer" controls src="PTM2.mp3"></audio>

    <div class="display-box">
        <div class="status-text" id="statusDisplay">Initializing engine...</div>
        <div id="timelineDump" class="timeline-info"></div>
    </div>
</div>

// =========================================================
// 2. GLOBAL TRACKING VARIABLES (Original Compatibility)
// =========================================================
let markers = [];              // Global layout marker array required by player loops
let currentLearningStep = 1;   // Selected step (1 to 4)
let currentPasuramIndex = 0;   // Selected index inside data block (0 to 10)

// Reference media element hooks
const audioPlayer = document.getElementById('audioPlayer');
const statusDisplay = document.getElementById('statusDisplay');
const timelineDump = document.getElementById('timelineDump');

// =========================================================
// 3. RUNTIME TIMELINE FLATTENING ENGINE
// =========================================================
/**
 * Processes matrix chunks into a simple chronological linear array 
 * matching the legacy layout architecture.
 */
function generateFlatTimeline(pasuramData, step) {
    let sourcePool = [];
    
    switch (step) {
        case 1: sourcePool = pasuramData.step1; break;
        case 2: sourcePool = pasuramData.step2; break;
        case 3: sourcePool = pasuramData.step3; break;
        case 4: sourcePool = pasuramData.step4; break;
        default: sourcePool = pasuramData.step1;
    }

    const flatTimelineArray = [];
    
    sourcePool.forEach((segment, sliceIndex) => {
        flatTimelineArray.push(segment[0]);
        // Capture the final boundary termination timestamp
        if (sliceIndex === sourcePool.length - 1) {
            flatTimelineArray.push(segment[1]);
        }
    });
    
    return flatTimelineArray;
}

/**
 * Reconfigures global marker arrays and alerts the audio interface layers.
 */
function synchronizePlaybackEngine() {
    const targetedPasuram = PTM_2_DATA[currentPasuramIndex];
    
    // Process step conversion mapping
    markers = generateFlatTimeline(targetedPasuram, currentLearningStep);
    
    // Update interface readouts
    statusDisplay.innerText = `Active: Pasuram ${currentPasuramIndex + 1} | Learning Mode: Step ${currentLearningStep}`;
    timelineDump.innerText = `Current Legacy Active Marker Array: [${markers.join(', ')}]`;
    
    // Automatically set audio playback cursor head to start point of the selected pasuram
    if (markers.length > 0) {
        audioPlayer.currentTime = markers[0];
    }
}

// =========================================================
// 4. INTERFACE DOM EVENT HANDLERS
// =========================================================
function onLearningStepChange(selectNode) {
    currentLearningStep = parseInt(selectNode.value, 10);
    synchronizePlaybackEngine();
}

function onPasuramChange(selectNode) {
    currentPasuramIndex = parseInt(selectNode.value, 10);
    synchronizePlaybackEngine();
}

// Initialize structural timeline boundaries when template renders completely
window.addEventListener('DOMContentLoaded', () => {
    synchronizePlaybackEngine();
});

</html>
