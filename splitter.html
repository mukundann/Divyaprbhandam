<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marker.js Studio & Tester</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 800px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .left-panel, .right-panel { display: flex; flex-direction: column; }
        h2 { text-align: center; font-size: 1.2rem; margin-bottom: 15px; grid-column: span 2; }
        .upload-zone { border: 2px dashed #ccd0d5; padding: 15px; text-align: center; border-radius: 12px; cursor: pointer; margin-bottom: 10px; }
        audio { width: 100%; margin-bottom: 10px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        button { padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-record { background: #fb7373; color: white; }
        .btn-gen { background: #0070ba; color: white; grid-column: span 2; }
        textarea { flex-grow: 1; font-family: monospace; font-size: 0.75rem; padding: 10px; border: 1px solid #ccd0d5; border-radius: 8px; resize: none; min-height: 200px; }
        #marker-list { background: #f9fafb; border: 1px solid #e4e6eb; border-radius: 8px; height: 400px; overflow-y: auto; }
        .marker-item { display: flex; align-items: center; padding: 8px; border-bottom: 1px solid #eee; font-size: 0.8rem; }
        .marker-item:hover { background: #f0f7ff; }
        .item-info { flex-grow: 1; margin-left: 10px; }
        .btn-test { background: #6c757d; color: white; padding: 3px 8px; border-radius: 4px; margin-left: 5px; }
        .playing-marker { border-left: 5px solid #0070ba; background: #e7f3ff; }
    </style>
</head>
<body>

<div class="container">
    <h2>Marker Studio: Test, Select & Export</h2>

    <div class="left-panel">
        <div class="upload-zone" onclick="document.getElementById('audioInput').click()">
            <p id="file-label">Upload MP3/M4A</p>
            <input type="file" id="audioInput" accept="audio/*" style="display:none" onchange="loadAudio(this)">
        </div>
        <audio id="player" controls></audio>
        <div class="controls">
            <button class="btn-record" id="recordBtn" onclick="addMarker()" disabled>Record Marker (M)</button>
            <button onclick="clearMarkers()">Clear</button>
            <button class="btn-gen" onclick="generateMarkerJS()">Generate Marker.js Data</button>
        </div>
        <label style="font-size: 0.75rem; font-weight: bold;">Output for marker.js:</label>
        <textarea id="outputJson" readonly placeholder="Result will appear here..."></textarea>
    </div>

    <div class="right-panel">
        <label style="font-size: 0.75rem; font-weight: bold; margin-bottom: 5px;">Recorded Segments (Uncheck to Skip):</label>
        <div id="marker-list"></div>
    </div>
</div>

<script>
    let audioBuffer = null;
    let rawMarkers = []; // Timestamps
    let selections = []; // Booleans
    const player = document.getElementById('player');
    const markerList = document.getElementById('marker-list');
    const outputJson = document.getElementById('outputJson');
    const statusDiv = document.createElement('div'); // Internal status tracker

    async function loadAudio(input) {
        const file = input.files[0];
        if (!file) return;
        document.getElementById('file-label').innerText = file.name;
        const arrayBuffer = await file.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        player.src = URL.createObjectURL(file);
        document.getElementById('recordBtn').disabled = false;
    }

    function addMarker() {
        const time = parseFloat(player.currentTime.toFixed(2));
        if (time <= 0 || rawMarkers.includes(time)) return;
        rawMarkers.push(time);
        rawMarkers.sort((a, b) => a - b);
        selections = rawMarkers.map(() => true); // Default all to selected
        renderMarkers();
    }

    function renderMarkers() {
        markerList.innerHTML = rawMarkers.map((m, i) => {
            const start = i === 0 ? 0 : rawMarkers[i-1];
            const end = m;
            return `
                <div class="marker-item" id="item-${i}">
                    <input type="checkbox" ${selections[i] ? 'checked' : ''} onchange="toggleSelection(${i})">
                    <div class="item-info">Seg ${i+1}: ${start}s - ${end}s</div>
                    <button class="btn-test" onclick="testSegment(${start}, ${end}, ${i})">Test</button>
                </div>
            `;
        }).join('');
    }

    function toggleSelection(index) {
        selections[index] = !selections[index];
    }

    let testMonitor = null;
    function testSegment(start, end, index) {
        document.querySelectorAll('.marker-item').forEach(el => el.classList.remove('playing-marker'));
        document.getElementById(`item-${index}`).classList.add('playing-marker');
        
        player.currentTime = start;
        player.play();
        if (testMonitor) clearInterval(testMonitor);
        testMonitor = setInterval(() => {
            if (player.currentTime >= end) {
                player.pause();
                clearInterval(testMonitor);
            }
        }, 30);
    }

    function generateMarkerJS() {
        const result = [];
        let lastEnd = 0;

        for (let i = 0; i < rawMarkers.length; i++) {
            if (!selections[i]) {
                // If segment is skipped, update lastEnd to skip this duration
                lastEnd = rawMarkers[i];
                continue;
            }

            const currentStart = i === 0 ? 0 : rawMarkers[i-1];
            const currentEnd = rawMarkers[i];

            if (currentStart === lastEnd) {
                // Contiguous segment
                result.push(currentEnd);
            } else {
                // Non-contiguous (jumped over a skipped segment)
                result.push({ start: currentStart, end: currentEnd });
            }
            lastEnd = currentEnd;
        }

        outputJson.value = JSON.stringify(result, null, 2);
    }

    function clearMarkers() {
        if(confirm("Clear all?")) {
            rawMarkers = []; selections = []; renderMarkers(); outputJson.value = "";
        }
    }

    window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'm') addMarker(); });
</script>
</body>
</html>
