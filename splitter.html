<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marker Studio - Pro Precision</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 1200px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        h2 { text-align: center; font-size: 1.2rem; margin: 0 0 15px 0; grid-column: span 2; color: #1c1e21; }
        .left-panel, .right-panel { display: flex; flex-direction: column; min-width: 0; }
        .upload-zone { border: 2px dashed #ccd0d5; padding: 15px; text-align: center; border-radius: 12px; margin-bottom: 10px; }
        .url-input-group { display: flex; gap: 5px; margin-bottom: 10px; }
        input[type="text"], input[type="number"], .ts-input { border: 1px solid #ccd0d5; border-radius: 8px; padding: 8px; font-size: 0.85rem; }
        input[type="text"] { flex-grow: 1; }
        audio { width: 100%; margin-top: 5px; border-radius: 8px; }
        #yt-container { width: 100%; aspect-ratio: 16/9; background: #000; display: none; border-radius: 12px; overflow: hidden; margin-top: 5px; }
        .btn { background: #0070ba; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: background 0.2s; }
        .btn:hover { background: #005ea6; }
        .btn:disabled { background: #ccd0d5; cursor: not-allowed; }
        .btn-red { background: #ea3d2f; }
        .btn-red:hover { background: #d32f2f; }
        .btn-gray { background: #f0f2f5; color: #4b4f56; }
        .btn-gray:hover { background: #e4e6eb; }
        .control-row { display: flex; gap: 10px; margin: 15px 0; align-items: center; }
        .right-panel { background: #f7f9fa; border-radius: 12px; padding: 15px; border: 1px solid #e4e6eb; max-height: 750px; overflow-y: auto; }
        .pasuram-group { background: white; border-radius: 10px; padding: 12px; margin-bottom: 15px; border: 1px solid #e4e6eb; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .segment-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 0.8rem; }
        .ts-input { width: 55px; text-align: center; padding: 4px; border-radius: 6px; }
        .btn-small { padding: 4px 8px; font-size: 0.75rem; border: 1px solid #ccd0d5; border-radius: 6px; background: white; cursor: pointer; }
        .btn-small:hover { background: #f0f2f5; }
        .btn-del { border-color: #f5c6cb; color: #721c24; background: #f8d7da; }
        .btn-del:hover { background: #f5c6cb; }
        .verse-text { display: none; }
        .playing-segment { background: #e1f5fe !important; border-left: 4px solid #0288d1; padding-left: 2px; }
        #status { font-weight: bold; color: #4b4f56; font-size: 0.85rem; margin-top: 10px; text-align: center; }
        .io-container { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
        textarea.io-box { width: 100%; height: 180px; font-family: monospace; font-size: 0.75rem; border: 1px solid #ccd0d5; border-radius: 8px; padding: 8px; box-sizing: border-box; resize: none; }
        
        /* New styling wrapper for internal split controls */
        .wizard-panel { background: #f7f9fa; border: 1px solid #e4e6eb; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .wizard-row { display: flex; gap: 10px; align-items: center; font-size: 0.85rem; color: #4b4f56; }
        .wizard-row select, .wizard-row input { padding: 6px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>Marker Studio - Pro Precision</h2>
    
    <div class="left-panel">
        <div class="upload-zone">
            <span style="font-size: 0.85rem; color:#4b4f56;">Upload Audio File:</span><br>
            <input type="file" accept="audio/*" onchange="loadLocalFile(this)" style="margin-top:5px; font-size:0.8rem;">
        </div>
        
        <div class="url-input-group">
            <input type="text" id="urlInput" placeholder="Paste Audio URL or YouTube Link...">
            <button class="btn" onclick="handleURL()">Load Link</button>
        </div>

        <div class="wizard-panel">
            <div class="wizard-row">
                <label style="font-weight: 600;">Split Strategy:</label>
                <select id="splitMethod" onchange="toggleSplitLabel()">
                    <option value="P">Pasurams (Groups of 8)</option>
                    <option value="S">Individual Segments</option>
                </select>
            </div>
            <div class="wizard-row">
                <label id="countLabel" style="font-weight: 600; flex-grow:1;">Target Pasurams Count:</label>
                <input type="number" id="splitCount" value="12" min="1" style="width: 70px; text-align: center;">
                <button class="btn btn-gray" onclick="triggerManualSplit()" style="padding: 6px 12px; border-radius: 8px;">Apply Split</button>
            </div>
        </div>

        <audio id="player" controls></audio>
        <div id="yt-container"><div id="yt-player"></div></div>

        <div class="control-row">
            <button id="recordBtn" class="btn btn-red" onclick="addMarker()" disabled style="flex-grow:1; padding:12px;">⚡ Capture Segment Point (M)</button>
            <button class="btn btn-gray" onclick="rewind()">↩ -2s</button>
            <button class="btn btn-gray btn-red" style="background:#f8d7da; color:#721c24;" onclick="clearMarkers()">🗑 Clear All</button>
        </div>

        <div class="io-container">
            <textarea id="ioJson" class="io-box" placeholder="JSON input/output interface..."></textarea>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="flex-grow:1;" onclick="generateMarkerJS()">⚙ Generate JS</button>
                <button class="btn btn-gray" style="flex-grow:1;" onclick="importFromText()">↑ Import</button>
            </div>
        </div>
        
        <div id="status">Segments: 0 | Pasurams: 0</div>
    </div>

    <div class="right-panel" id="marker-list">
        </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let rawMarkers = [];
    let currentHighlightIndex = -1;
    let currentFileName = "audio_data";
    let ytPlayer = null;
    let isYouTube = false;
    let detectedDuration = 0;
    const player = document.getElementById('player');
    const markerList = document.getElementById('marker-list');
    const ioJson = document.getElementById('ioJson');

    function toggleSplitLabel() {
        const method = document.getElementById('splitMethod').value;
        const label = document.getElementById('countLabel');
        const input = document.getElementById('splitCount');
        if (method === 'P') {
            label.innerText = "Target Pasurams Count:";
            input.value = "12";
        } else {
            label.innerText = "Total Segments Count:";
            input.value = "100";
        }
    }

    function handleURL() {
        const url = document.getElementById('urlInput').value.trim();
        if (url.includes('youtube.com') || url.includes('youtu.be')) setupYouTube(url);
        else setupDirectAudio(url);
    }

    function setupYouTube(url) {
        const videoId = url.split('v=')[1]?.split('&')[0] || url.split('/').pop();
        isYouTube = true; currentFileName = videoId;
        player.style.display = 'none'; document.getElementById('yt-container').style.display = 'block';
        if (ytPlayer) {
            ytPlayer.loadVideoById(videoId);
            setTimeout(() => { checkYTDurationAndPrompt(); }, 1500);
        } else {
            ytPlayer = new YT.Player('yt-player', { height: '100%', width: '100%', videoId,
                events: { 'onReady': () => { 
                    document.getElementById('recordBtn').disabled = false; 
                    setupSyncLoop(); 
                    setTimeout(() => { checkYTDurationAndPrompt(); }, 1500);
                }}
            });
        }
    }

    function checkYTDurationAndPrompt() {
        detectedDuration = ytPlayer.getDuration();
        if (detectedDuration > 0) {
            initializeEqualSplits(detectedDuration);
        } else {
            setTimeout(() => { 
                detectedDuration = ytPlayer.getDuration() || 694;
                initializeEqualSplits(detectedDuration); 
            }, 2000);
        }
    }

    function setupDirectAudio(url) {
        isYouTube = false; currentFileName = url.split('/').pop().split('.')[0];
        document.getElementById('yt-container').style.display = 'none'; player.style.display = 'block';
        player.src = url; 
        player.load(); 
        document.getElementById('recordBtn').disabled = false;
        setupSyncLoop();

        player.onloadedmetadata = function() {
            detectedDuration = player.duration;
            initializeEqualSplits(detectedDuration);
        };
    }

    function loadLocalFile(input) {
        const file = input.files[0]; if (file) setupDirectAudio(URL.createObjectURL(file));
    }

    function triggerManualSplit() {
        if (!detectedDuration || isNaN(detectedDuration)) {
            const fallback = prompt("Duration not yet detected. Please confirm total file duration in seconds:", "694");
            if (!fallback) return;
            detectedDuration = parseFloat(fallback);
        }
        initializeEqualSplits(detectedDuration);
    }

    function initializeEqualSplits(totalDuration) {
        const method = document.getElementById('splitMethod').value;
        const countInput = parseInt(document.getElementById('splitCount').value, 10);
        
        if (!countInput || isNaN(countInput) || countInput <= 0) return;

        let totalSegments = (method === 'P') ? countInput * 8 : countInput;
        const segmentDuration = parseFloat((totalDuration / totalSegments).toFixed(2));
        rawMarkers = [];

        for (let i = 0; i < totalSegments; i++) {
            const start = parseFloat((i * segmentDuration).toFixed(2));
            const end = (i === totalSegments - 1) ? parseFloat(totalDuration.toFixed(2)) : parseFloat((start + segmentDuration).toFixed(2));
            rawMarkers.push({ start, end, text: "" });
        }

        renderMarkers();
        generateMarkerJS();
    }

    function addMarker() {
        const time = parseFloat((isYouTube ? ytPlayer.getCurrentTime() : player.currentTime).toFixed(2));
        const start = rawMarkers.length === 0 ? 0 : rawMarkers[rawMarkers.length - 1].end;
        rawMarkers.push({ start, end: time, text: "" });
        renderMarkers();
    }

    function deleteMarker(index) {
        if (!confirm("Remove this segment? Subsequent segments will shift up.")) return;
        rawMarkers.splice(index, 1);
        for (let i = 0; i < rawMarkers.length; i++) {
            if (i > 0) rawMarkers[i].start = rawMarkers[i-1].end;
        }
        renderMarkers();
    }

    function updateMarker(index, field, value) {
        const val = parseFloat(value);
        rawMarkers[index][field] = val;
        if (field === 'end' && rawMarkers[index+1]) rawMarkers[index+1].start = val;
        if (field === 'start' && rawMarkers[index-1]) rawMarkers[index-1].end = val;
        renderMarkers();
    }

    function snapToCurrent(index) {
        const time = parseFloat((isYouTube ? ytPlayer.getCurrentTime() : player.currentTime).toFixed(2));
        updateMarker(index, 'end', time);
    }

    function renderMarkers() {
        let html = '';
        for (let i = 0; i < rawMarkers.length; i += 8) {
            const segments = rawMarkers.slice(i, i + 8);
            html += `<div class="pasuram-group">
                ${segments.map((s, sIdx) => {
                    const globalIdx = i + sIdx;
                    return `
                    <div class="segment-row" id="item-${globalIdx}">
                        <span style="width:20px">H${sIdx+1}</span>
                        <input type="number" step="0.01" class="ts-input" value="${s.start}" onchange="updateMarker(${globalIdx}, 'start', this.value)">
                        <input type="number" step="0.01" class="ts-input" value="${s.end}" onchange="updateMarker(${globalIdx}, 'end', this.value)">
                        <button class="btn-small" style="background:#0070ba; color:white" onclick="snapToCurrent(${globalIdx})">Snap</button>
                        <button class="btn-small" onclick="testSegment(${s.start}, ${s.end}, ${globalIdx})">▶</button>
                        <button class="btn-small btn-del" onclick="deleteMarker(${globalIdx})">✕</button>
                    </div>`;
                }).join('')}
            </div>`;
        }
        markerList.innerHTML = html;
        document.getElementById('status').innerText = `Segments: ${rawMarkers.length} | Pasurams: ${Math.ceil(rawMarkers.length/8)}`;
    }

    function testSegment(start, end, highlightIdx) {
        highlightMarker(highlightIdx);
        if (isYouTube) { ytPlayer.seekTo(start); ytPlayer.playVideo(); }
        else { player.currentTime = start; player.play(); }
        const checker = setInterval(() => {
            const curr = isYouTube ? ytPlayer.getCurrentTime() : player.currentTime;
            if (curr >= end) { isYouTube ? ytPlayer.pauseVideo() : player.pause(); clearInterval(checker); }
        }, 30);
    }

    function highlightMarker(index) {
        document.querySelectorAll('.segment-row').forEach(el => el.classList.remove('playing-segment'));
        const el = document.getElementById(`item-${index}`);
        if (el) el.classList.add('playing-segment');
    }

    function generateMarkerJS() {
        const result = [];
        for (let i = 0; i < rawMarkers.length; i += 8) {
            const seg = rawMarkers.slice(i, i + 8);
            const pNum = (i / 8) + 1;
            
            const step1Pairs = seg.map(s => [s.start, s.end]);
            const step2Pairs = [];
            const step3Pairs = [];
            
            for (let j = 0; j < step1Pairs.length; j += 2) {
                if (step1Pairs[j+1]) {
                    step2Pairs.push([step1Pairs[j][0], step1Pairs[j+1][1]]);
                } else {
                    step2Pairs.push([step1Pairs[j][0], step1Pairs[j][1]]);
                }
            }
            
            for (let k = 0; k < step2Pairs.length; k += 2) {
                if (step2Pairs[k+1]) {
                    step3Pairs.push([step2Pairs[k][0], step2Pairs[k+1][1]]);
                } else {
                    step3Pairs.push([step2Pairs[k][0], step2Pairs[k][1]]);
                }
            }
            
            result.push({
                p: pNum, 
                text: "", 
                step1: step1Pairs,
                step2: step2Pairs,
                step3: step3Pairs,
                step4: [seg[0].start, seg[seg.length - 1].end]
            });
        }

        const customLines = result.map(entry => {
            return `  { "p": ${entry.p}, "text": "", "step1": ${JSON.stringify(entry.step1)}, "step2": ${JSON.stringify(entry.step2)}, "step3": ${JSON.stringify(entry.step3)}, "step4": ${JSON.stringify(entry.step4)} }`;
        });

        ioJson.value = `'${currentFileName}' : [\n${customLines.join(",\n")}\n],`;
    }

    function importFromText() {
        try {
            const raw = ioJson.value.trim();
            const jsonPart = raw.includes(':') ? raw.split(': ')[1] : raw;
            const data = JSON.parse(jsonPart);
            rawMarkers = [];
            data.forEach(p => {
                p.step1.forEach((s, idx) => {
                    rawMarkers.push({ start: s[0], end: s[1], text: "" });
                });
            });
            renderMarkers();
        } catch (e) { alert("Import failed. Check JSON format."); }
    }

    function setupSyncLoop() {
        const monitor = () => {
            const time = isYouTube ? (ytPlayer?.getCurrentTime() || 0) : player.currentTime;
            const idx = rawMarkers.findIndex(m => time >= m.start && time < m.end);
            if (idx !== -1 && idx !== currentHighlightIndex) {
                currentHighlightIndex = idx;
                highlightMarker(idx);
            }
            requestAnimationFrame(monitor);
        };
        requestAnimationFrame(monitor);
    }

    function rewind() { isYouTube ? ytPlayer.seekTo(ytPlayer.getCurrentTime() - 2) : player.currentTime -= 2; }
    function clearMarkers() { if(confirm("Clear all?")) { rawMarkers = []; renderMarkers(); }}
    window.addEventListener('keydown', (e) => { 
        if (e.key.toLowerCase() === 'm' && !document.getElementById('recordBtn').disabled) {
            if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                addMarker(); 
            }
        }
    });
</script>
</body>
</html>
