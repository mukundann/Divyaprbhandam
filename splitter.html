<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marker Studio | Audio Processor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: 0 auto; background: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        audio { width: 100%; margin: 20px 0; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: opacity 0.2s; }
        .btn-start { background: #28a745; color: white; }
        .btn-end { background: #dc3545; color: white; }
        .btn-export { background: #007bff; color: white; }
        #marker-list { margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .marker-item { background: #f8f9fa; padding: 8px; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; }
        .file-info { font-size: 0.9em; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Marker Studio</h2>
    
    <div class="file-info">
        <label for="audioUpload"><strong>Load Audio File:</strong></label><br>
        <input type="file" id="audioUpload" accept=".m4a, .mp3, .ogg, .wav" />
    </div>

    <audio id="audioPlayer" controls></audio>

    <div class="controls">
        <button class="btn-start" onclick="setStart()">Set Start (S)</button>
        <button class="btn-end" onclick="setEnd()">Set End (E)</button>
        <button class="btn-export" onclick="exportMarkers()">Export marker.js</button>
    </div>

    <div id="marker-list">
        <h3>Current Markers</h3>
        <div id="display-area"></div>
    </div>
</div>

<script>
    const audio = document.getElementById('audioPlayer');
    const display = document.getElementById('display-area');
    const audioUpload = document.getElementById('audioUpload');
    
    let markers = [];
    let currentStart = null;
    let currentFileName = "unknown";

    // Handle Ogg/M4A Loading
    audioUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        currentFileName = file.name.split('.')[0];
        const url = URL.createObjectURL(file);
        audio.src = url;
        audio.load();
        console.log("Loaded:", file.name, "Type:", file.type);
    });

    function setStart() {
        currentStart = audio.currentTime.toFixed(3);
        console.log("Start set at:", currentStart);
    }

    function setEnd() {
        if (currentStart === null) {
            alert("Set a start point first!");
            return;
        }
        const end = audio.currentTime.toFixed(3);
        markers.push({ start: parseFloat(currentStart), end: parseFloat(end) });
        currentStart = null;
        updateDisplay();
    }

    function updateDisplay() {
        display.innerHTML = '';
        markers.forEach((m, i) => {
            display.innerHTML += `
                <div class="marker-item">
                    <span>Segment ${i + 1}: ${m.start}s - ${m.end}s</span>
                    <button onclick="removeMarker(${i})" style="padding:2px 8px; font-size:12px;">Delete</button>
                </div>`;
        });
    }

    function removeMarker(index) {
        markers.splice(index, 1);
        updateDisplay();
    }

    function exportMarkers() {
        if (markers.length === 0) {
            alert("No markers to export!");
            return;
        }

        const databaseKey = `${currentFileName}.all`;
        const output = `window.MARKER_DATABASE = window.MARKER_DATABASE || {};\n` +
                       `window.MARKER_DATABASE["${databaseKey}"] = ${JSON.stringify(markers, null, 2)};`;

        const blob = new Blob([output], { type: 'text/javascript' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'marker.js';
        a.click();
    }

    // Keyboard Shortcuts for Efficiency
    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 's') setStart();
        if (e.key.toLowerCase() === 'e') setEnd();
    });
</script>

</body>
</html>
