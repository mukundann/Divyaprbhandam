<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marker Studio - Pro Precision</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 1200px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        h2 { text-align: center; font-size: 1.2rem; margin: 0 0 15px 0; grid-column: span 2; color: #1c1e21; }
        .left-panel, .right-panel { display: flex; flex-direction: column; min-width: 0; }
        .upload-zone { border: 2px dashed #ccd0d5; padding: 15px; text-align: center; border-radius: 12px; margin-bottom: 10px; }
        .url-input-group { display: flex; gap: 5px; margin-bottom: 10px; }
        input[type="text"], input[type="number"] { padding: 8px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 0.8rem; }
        #urlInput { flex-grow: 1; }
        audio { width: 100%; margin-bottom: 10px; }
        #yt-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; margin-bottom: 10px; overflow: hidden; display: none; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        button { padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .btn-record { background: #fb7373; color: white; width: 100%; margin-bottom: 10px; height: 50px; font-size: 1rem; }
        .btn-record:disabled { background: #ccd0d5; cursor: not-allowed; }
        .btn-gen { background: #0070ba; color: white; margin-top: 10px; }
        textarea { flex-grow: 1; font-family: 'Courier New', monospace; font-size: 0.75rem; padding: 10px; border: 1px solid #ccd0d5; border-radius: 8px; resize: none; min-height: 120px; }
        #marker-list { background: #f9fafb; border: 1px solid #e4e6eb; border-radius: 8px; height: 650px; overflow-y: auto; padding: 10px; }
        .pasuram-group { background: white; border: 1px solid #ddd; border-bottom: 4px solid #0070ba; border-radius: 8px; margin-bottom: 15px; padding: 10px; }
        .segment-row { display: flex; align-items: center; gap: 4px; padding: 4px; background: #f0f2f5; margin-bottom: 2px; border-radius: 4px; font-size: 0.7rem; }
        .playing-segment { outline: 2px solid #0070ba; background: #e7f3ff !important; }
        .ts-input { width: 55px; border: 1px solid #ccc; padding: 2px; }
        .btn-small { padding: 3px 6px; font-size: 0.65rem; border-radius: 4px; }
        .btn-del { background: #ffeded; color: #d93025; border: 1px solid #ffcccc; }
        .btn-del:hover { background: #d93025; color: white; }
        .status-bar { font-size: 0.8rem; font-weight: bold; color: #0070ba; background: #e7f3ff; padding: 8px; border-radius: 8px; margin-bottom: 10px; text-align: center; }
        .verse-text { width: 95%; margin-top: 5px; height: 40px; font-size: 0.75rem; border-radius: 4px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container">
    <h2>Marker Studio: Stepped Re-indexing Engine</h2>

    <div class="left-panel">
        <div class="upload-zone">
            <div class="url-input-group">
                <input type="text" id="urlInput" placeholder="YouTube/Audio URL">
                <button onclick="handleURL()" style="background:#0070ba; color:white;">Load</button>
            </div>
            <button style="width:100%; background:#f0f2f5; border:1px solid #ccd0d5" onclick="document.getElementById('audioInput').click()">Local File</button>
            <input type="file" id="audioInput" accept="audio/*" style="display:none" onchange="loadLocalFile(this)">
        </div>

        <div id="status" class="status-bar">Ready for Input</div>
        <audio id="player" controls style="display:none"></audio>
        <div id="yt-container"><div id="yt-player"></div></div>
        
        <button class="btn-record" id="recordBtn" onclick="addMarker()" disabled>Record Half-Line (M)</button>
        
        <div class="controls">
            <button onclick="clearMarkers()" style="background:#e4e6eb">Reset All</button>
            <button style="background:#6c757d; color:white" onclick="rewind()">Rewind 2s</button>
        </div>

        <textarea id="ioJson" placeholder="JSON IO Area..."></textarea>
        <div style="display:flex; gap:5px;">
            <button style="flex:1; background:#28a745; color:white;" onclick="importFromText()">↑ Import</button>
            <button class="btn-gen" style="flex:1" onclick="generateMarkerJS()">↓ Export Stepped JSON</button>
        </div>
    </div>

    <div class="right-panel">
        <div id="marker-list"></div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let rawMarkers = [];
    let currentHighlightIndex = -1;
    let currentFileName = "audio_data";
    let ytPlayer = null;
    let isYouTube = false;
    const player = document.getElementById('player');
    const markerList = document.getElementById('marker-list');
    const ioJson = document.getElementById('ioJson');

    function handleURL() {
        const url = document.getElementById('urlInput').value.trim();
        if (url.includes('youtube.com') || url.includes('youtu.be')) setupYouTube(url);
        else setupDirectAudio(url);
    }

    function setupYouTube(url) {
        const videoId = url.split('v=')[1]?.split('&')[0] || url.split('/').pop();
        isYouTube = true; currentFileName = videoId;
        player.style.display = 'none'; document.getElementById('yt-container').style.display = 'block';
        if (ytPlayer) ytPlayer.loadVideoById(videoId);
        else {
            ytPlayer = new YT.Player('yt-player', { height: '100%', width: '100%', videoId,
                events: { 'onReady': () => { document.getElementById('recordBtn').disabled = false; setupSyncLoop(); }}
            });
        }
    }

    function setupDirectAudio(url) {
        isYouTube = false; currentFileName = url.split('/').pop().split('.')[0];
        document.getElementById('yt-container').style.display = 'none'; player.style.display = 'block';
        player.src = url; player.load(); document.getElementById('recordBtn').disabled = false;
        setupSyncLoop();
    }

    function loadLocalFile(input) {
        const file = input.files[0]; if (file) setupDirectAudio(URL.createObjectURL(file));
    }

    function addMarker() {
        const time = parseFloat((isYouTube ? ytPlayer.getCurrentTime() : player.currentTime).toFixed(2));
        const start = rawMarkers.length === 0 ? 0 : rawMarkers[rawMarkers.length - 1].end;
        rawMarkers.push({ start, end: time, text: "" });
        renderMarkers();
    }

    // --- RE-INDEXING CORE LOGIC ---
    function deleteMarker(index) {
        if (!confirm("Remove this segment? Subsequent segments will shift up.")) return;
        
        // Remove the target
        rawMarkers.splice(index, 1);
        
        // Readjust logic: Ensure timestamps remain contiguous
        for (let i = 0; i < rawMarkers.length; i++) {
            if (i === 0) {
                // First marker starts at 0 or its original start if preferred
                // For simplicity, we keep the first start point as is.
            } else {
                // Each start must match previous end to avoid gaps
                rawMarkers[i].start = rawMarkers[i-1].end;
            }
        }
        renderMarkers();
    }

    function updateMarker(index, field, value) {
        const val = parseFloat(value);
        rawMarkers[index][field] = val;
        
        // Contiguous check: If I change segment 2's end, segment 3's start must move
        if (field === 'end' && rawMarkers[index+1]) {
            rawMarkers[index+1].start = val;
        }
        // If I change segment 2's start, segment 1's end must move
        if (field === 'start' && rawMarkers[index-1]) {
            rawMarkers[index-1].end = val;
        }
        renderMarkers();
    }

    function snapToCurrent(index) {
        const time = parseFloat((isYouTube ? ytPlayer.getCurrentTime() : player.currentTime).toFixed(2));
        updateMarker(index, 'end', time);
    }

    function renderMarkers() {
        let html = '';
        // Group by 8 for display, but allow individual deletion
        for (let i = 0; i < rawMarkers.length; i += 8) {
            const pIdx = Math.floor(i / 8) + 1;
            const segments = rawMarkers.slice(i, i + 8);
            
            html += `<div class="pasuram-group">
                <div style="font-weight:bold; font-size:0.75rem; color:#0070ba; margin-bottom:5px;">
                    PASURAM ${pIdx} ${segments.length < 8 ? '(Incomplete: ' + segments.length + '/8)' : ''}
                </div>
                ${segments.map((s, sIdx) => {
                    const globalIdx = i + sIdx;
                    return `
                    <div class="segment-row" id="item-${globalIdx}">
                        <span style="width:20px">H${sIdx+1}</span>
                        <input type="number" step="0.01" class="ts-input" value="${s.start}" onchange="updateMarker(${globalIdx}, 'start', this.value)">
                        <input type="number" step="0.01" class="ts-input" value="${s.end}" onchange="updateMarker(${globalIdx}, 'end', this.value)">
                        <button class="btn-small" style="background:#0070ba; color:white" onclick="snapToCurrent(${globalIdx})">Snap</button>
                        <button class="btn-small" onclick="testSegment(${s.start}, ${s.end}, ${globalIdx})">▶</button>
                        <button class="btn-small btn-del" onclick="deleteMarker(${globalIdx})">✕</button>
                    </div>`;
                }).join('')}
                <textarea class="verse-text" placeholder="Tamil Text for Pasuram ${pIdx}..." onchange="rawMarkers[${i}].text = this.value">${rawMarkers[i].text || ""}</textarea>
            </div>`;
        }
        markerList.innerHTML = html;
        document.getElementById('status').innerText = `Segments: ${rawMarkers.length} | Pasurams: ${Math.floor(rawMarkers.length/8)}`;
    }

    // --- PLAYBACK & EXPORT ---
    function testSegment(start, end, highlightIdx) {
        highlightMarker(highlightIdx);
        if (isYouTube) { ytPlayer.seekTo(start); ytPlayer.playVideo(); }
        else { player.currentTime = start; player.play(); }
        const checker = setInterval(() => {
            const curr = isYouTube ? ytPlayer.getCurrentTime() : player.currentTime;
            if (curr >= end) { isYouTube ? ytPlayer.pauseVideo() : player.pause(); clearInterval(checker); }
        }, 30);
    }

    function highlightMarker(index) {
        document.querySelectorAll('.segment-row').forEach(el => el.classList.remove('playing-segment'));
        const el = document.getElementById(`item-${index}`);
        if (el) el.classList.add('playing-segment');
    }

    function generateMarkerJS() {
        const result = [];
        for (let i = 0; i < rawMarkers.length; i += 8) {
            const seg = rawMarkers.slice(i, i + 8);
            if (seg.length === 8) {
                result.push({
                    p: (i / 8) + 1, text: seg[0].text,
                    step1: seg.map(s => [s.start, s.end]),
                    step2: [[seg[0].start, seg[1].end], [seg[2].start, seg[3].end], [seg[4].start, seg[5].end], [seg[6].start, seg[7].end]],
                    step3: [[seg[0].start, seg[3].end], [seg[4].start, seg[7].end]],
                    step4: [seg[0].start, seg[7].end]
                });
            }
        }
        ioJson.value = `'${currentFileName}' : ${JSON.stringify(result, null, 2)},`;
    }

    function importFromText() {
        try {
            const raw = ioJson.value.trim();
            const jsonPart = raw.includes(':') ? raw.split(': ')[1] : raw;
            const data = JSON.parse(jsonPart);
            rawMarkers = [];
            data.forEach(p => {
                p.step1.forEach((s, idx) => {
                    rawMarkers.push({ start: s[0], end: s[1], text: idx === 0 ? p.text : "" });
                });
            });
            renderMarkers();
        } catch (e) { alert("Import failed. Check JSON format."); }
    }

    function setupSyncLoop() {
        const monitor = () => {
            const time = isYouTube ? (ytPlayer?.getCurrentTime() || 0) : player.currentTime;
            const idx = rawMarkers.findIndex(m => time >= m.start && time < m.end);
            if (idx !== -1 && idx !== currentHighlightIndex) {
                currentHighlightIndex = idx;
                highlightMarker(idx);
            }
            requestAnimationFrame(monitor);
        };
        requestAnimationFrame(monitor);
    }

    function rewind() { isYouTube ? ytPlayer.seekTo(ytPlayer.getCurrentTime() - 2) : player.currentTime -= 2; }
    function clearMarkers() { if(confirm("Clear all?")) { rawMarkers = []; renderMarkers(); }}
    window.addEventListener('keydown', (e) => { 
        if (e.key.toLowerCase() === 'm' && !document.getElementById('recordBtn').disabled) {
            if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                addMarker(); 
            }
        }
    });
</script>
</body>
</html>
