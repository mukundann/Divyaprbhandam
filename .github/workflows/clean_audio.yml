name: Audio Cleanup Action
on:
  push:
    paths:
      - 'marker.js' # Triggered only when you update markers
      - 'audiofiles/**'  # Or when you upload new raw audio files

jobs:
  clean-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt update && sudo apt install -y ffmpeg

      - name: Run Processor
        run: node scripts/process_audio.js

      - name: Push Cleaned Files
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add audiofiles/clean/
          git commit -m "Automated cleanup of NAT/PMT audio" || echo "No changes"
          git push
