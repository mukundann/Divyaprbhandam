name: Smoke test

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '*.js'
      - 'aruLicheyal/**'
      - 'offline-manifest.json'
      - 'scripts/smoke_test.py'
      - 'scripts/server.py'
      - 'scripts/build_offline_manifest.py'
      - '.github/workflows/smoke-test.yml'
  pull_request:
    paths:
      - 'index.html'
      - '*.js'
      - 'aruLicheyal/**'
      - 'offline-manifest.json'
      - 'scripts/smoke_test.py'
      - 'scripts/server.py'
      - 'scripts/build_offline_manifest.py'
      - '.github/workflows/smoke-test.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run smoke tests
        run: python3 scripts/smoke_test.py
