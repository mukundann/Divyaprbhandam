name: Generate Automated Prabandha Sync Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'markers/**'
      - 'audiofiles/**'
      - '*.js'
  workflow_dispatch:

# Force execution environments to utilize Node.js 24 runtime structures natively
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Build Context
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Upgraded structural baseline from 18 to 24

      - name: Run Flat Tree Hashing
        run: node .github/scripts/build-manifest.js

      - name: Commit and Push Updated Sync Manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: systemic node24 manifest compliance update [skip ci]"
          file_pattern: 'sync-check.json'