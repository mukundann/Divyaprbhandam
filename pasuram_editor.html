<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasuram Browser & Tamil Editor</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background-color: #f4f6f9; }
        header { background-color: #2c3e50; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .lang-select { padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; background: white; color: #333; cursor: pointer; }
        .container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 300px; background: #ffffff; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        .sidebar-header { padding: 10px; background: #e9ecef; font-weight: bold; border-bottom: 1px solid #ccc; }
        .list-group { overflow-y: auto; flex: 1; list-style: none; margin: 0; padding: 0; }
        .list-group-item { padding: 12px 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
        .list-group-item:hover { background-color: #f0f4f8; }
        .list-group-item.active { background-color: #007bff; color: white; }
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .editor-container { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        textarea { width: 100%; height: 180px; font-size: 18px; padding: 12px; font-family: 'Latha', 'Tamil Sangam MN', 'Segoe UI', sans-serif; border: 1px solid #ccc; border-radius: 4px; resize: vertical; line-height: 1.5; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-primary { background-color: #28a745; color: white; }
        .btn-primary:hover { background-color: #218838; }
        .btn-secondary { background-color: #007bff; color: white; }
        .btn-secondary:hover { background-color: #0069d9; }
        .btn-nav { background-color: #6c757d; color: white; }
        .btn-nav:hover { background-color: #5a6268; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .editor-header { display: flex; justify-content: space-between; align-items: center; }
        
        /* Dynamic Virtual Keyboard Styling */
        .keyboard-container { background: #e9ecef; border: 1px solid #ccc; border-radius: 4px; padding: 10px; margin-top: 10px; }
        .keyboard-title { font-size: 12px; font-weight: bold; margin-bottom: 8px; color: #495057; text-transform: uppercase; }
        .keyboard-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 5px; }
        .key { background: white; border: 1px solid #ced4da; border-radius: 3px; padding: 6px 10px; font-size: 16px; cursor: pointer; user-select: none; }
        .key:hover { background: #007bff; color: white; border-color: #007bff; }
        .key-action { background: #6c757d; color: white; }
    </style>
</head>
<body>

<header>
    <h2>Pasuram Browser & Editor</h2>
    <div class="header-actions">
        <select id="langSelect" class="lang-select" onchange="switchLanguage()" style="display:none;">
            <option value="ta">Tamil (ta)</option>
        </select>
        <button class="btn btn-secondary" onclick="openFile()">Open Pasuram File</button>
        <button class="btn btn-primary" id="saveBtn" onclick="saveFile()" disabled>Save File Back to Folder</button>
    </div>
</header>

<div class="container">
    <div class="sidebar">
        <div class="sidebar-header">Pasuram Sections</div>
        <ul class="list-group" id="pasuramList">
            <li class="list-group-item">Please open a .js file...</li>
        </ul>
    </div>
    
    <div class="main-content">
        <div class="editor-container">
            <div class="editor-header">
                <label for="pasuramEditor"><strong id="currentEditingLabel">Select a Pasuram step to edit:</strong></label>
                <div>
                    <button class="btn btn-nav" id="prevBtn" onclick="navigate(-1)" disabled>Previous</button>
                    <button class="btn btn-nav" id="nextBtn" onclick="navigate(1)" disabled>Next</button>
                </div>
            </div>
            <textarea id="pasuramEditor" placeholder="Loaded text will appear here..."></textarea>
            
            <!-- Dynamic Virtual Keyboard -->
            <div class="keyboard-container">
                <div class="keyboard-title" id="keyboardTitle">Tamil Virtual Keyboard (click to insert text)</div>
                <div class="keyboard-row" id="vowelsRow"></div>
                <div class="keyboard-row" id="consonantsRow"></div>
                <div class="keyboard-row" id="modifiersRow"></div>
                <div class="keyboard-row">
                    <button class="key key-action" onclick="insertAtCursor(' * ')"> * (Asterisk)</button>
                    <button class="key key-action" onclick="insertAtCursor(' *** ')"> *** (Triple Asterisk)</button>
                    <button class="key key-action" onclick="insertAtCursor('🙏 ')">🙏 (Prayer)</button>
                    <button class="key key-action" onclick="insertAtCursor(' ')">Space</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let fileHandle = null;
    let originalFileContent = '';
    let allBundles = {};
    let parsedData = {};
    let currentLang = 'ta';
    let selectedKey = null;
    let selectedStep = null;
    let pasuramItemsList = [];
    let currentIndex = -1;

    // Keyboard layouts for different languages
    const keyboardLayouts = {
        ta: {
            title: "Tamil Virtual Keyboard (click to insert text)",
            vowels: ['அ', 'ஆ', 'இ', 'ஈ', 'உ', 'ஊ', 'எ', 'ஏ', 'ஐ', 'ஒ', 'ஓ', 'ஔ', 'ஃ'],
            consonants: ['க', 'ங', 'ச', 'ஞ', 'ட', 'ண', 'த', 'ந', 'ப', 'ம', 'ய', 'ர', 'ல', 'வ', 'ழ', 'ள', 'ற', 'ன', 'ஶ', 'ஜ', 'ஷ', 'ஸ', 'ஹ'],
            modifiers: ['்', 'ா', 'ி', 'ீ', 'ு', 'ூ', 'ெ', 'ே', 'ை', 'ொ', 'ோ', 'ௌ']
        },
        en: {
            title: "English Virtual Keyboard (click to insert text)",
            vowels: ['A', 'E', 'I', 'O', 'U', 'a', 'e', 'i', 'o', 'u'],
            consonants: ['B', 'C', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'M', 'N', 'P', 'Q', 'R', 'S', 'T', 'V', 'W', 'X', 'Y', 'Z', 'b', 'c', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'm', 'n', 'p', 'q', 'r', 's', 't', 'v', 'w', 'x', 'y', 'z'],
            modifiers: ['.', ',', '?', '!', '-', '_', "'", '"', ';', ':']
        }
    };

    function initKeyboard(lang = 'ta') {
        currentLang = lang;
        const layout = keyboardLayouts[lang] || keyboardLayouts['ta'];

        document.getElementById('keyboardTitle').innerText = layout.title;

        const vRow = document.getElementById('vowelsRow');
        const cRow = document.getElementById('consonantsRow');
        const mRow = document.getElementById('modifiersRow');

        vRow.innerHTML = '';
        cRow.innerHTML = '';
        mRow.innerHTML = '';

        layout.vowels.forEach(char => vRow.appendChild(createKeyBtn(char)));
        layout.consonants.forEach(char => cRow.appendChild(createKeyBtn(char)));
        layout.modifiers.forEach(char => mRow.appendChild(createKeyBtn(char)));
    }

    function createKeyBtn(char) {
        const btn = document.createElement('button');
        btn.className = 'key';
        btn.innerText = char;
        btn.onclick = () => insertAtCursor(char);
        return btn;
    }

    function insertAtCursor(text) {
        const textarea = document.getElementById('pasuramEditor');
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const val = textarea.value;
        
        textarea.value = val.substring(0, start) + text + val.substring(end);
        textarea.selectionStart = textarea.selectionEnd = start + text.length;
        textarea.focus();
        
        updateMemory();
    }

    async function openFile() {
        try {
            [fileHandle] = await window.showOpenFilePicker({
                types: [{
                    description: 'JavaScript Files',
                    accept: { 'text/javascript': ['.js'] }
                }]
            });
            
            const file = await fileHandle.getFile();
            originalFileContent = await file.text();
            
            parsePasuramContent(originalFileContent);
            document.getElementById('saveBtn').disabled = false;
        } catch (err) {
            if (err.name !== 'AbortError') {
                alert('Error opening file: ' + err.message);
            }
        }
    }

    function parsePasuramContent(content) {
        allBundles = {};
        const matches = [...content.matchAll(/const\s+text_bundle_([a-z]{2})\s*=\s*(\{[\s\S]*?\});/g)];
        
        if (matches.length === 0) {
            const singleMatch = content.match(/const\s+text_bundle_ta\s*=\s*(\{[\s\S]*?\});/);
            if (!singleMatch) {
                alert('Could not find any "text_bundle_xx" dictionary inside the selected JavaScript file.');
                return;
            }
            matches.push(['', 'ta', singleMatch[1]]);
        }

        matches.forEach(match => {
            const langCode = match[1];
            try {
                allBundles[langCode] = new Function(`return ${match[2]};`)();
            } catch (e) {
                console.error(`Failed to parse text_bundle_${langCode}:`, e.message);
            }
        });

        const langSelect = document.getElementById('langSelect');
        langSelect.innerHTML = '';
        const langs = Object.keys(allBundles);
        
        langs.forEach(lang => {
            const opt = document.createElement('option');
            opt.value = lang;
            opt.innerText = lang.toUpperCase() === 'TA' ? 'Tamil (ta)' : (lang.toUpperCase() === 'EN' ? 'English (en)' : `Language (${lang})`);
            langSelect.appendChild(opt);
        });

        langSelect.style.display = langs.length > 1 ? 'inline-block' : 'none';
        currentLang = allBundles['ta'] ? 'ta' : langs[0];
        langSelect.value = currentLang;

        parsedData = allBundles[currentLang] || {};
        initKeyboard(currentLang);
        renderSidebar();
    }

    function switchLanguage() {
        const select = document.getElementById('langSelect');
        currentLang = select.value;
        
        initKeyboard(currentLang);

        if (allBundles[currentLang]) {
            parsedData = allBundles[currentLang];
            if (selectedKey && selectedStep && parsedData[selectedKey]) {
                document.getElementById('pasuramEditor').value = parsedData[selectedKey][selectedStep] || '';
            } else {
                document.getElementById('pasuramEditor').value = '';
            }
        }
    }

    function renderSidebar() {
        const list = document.getElementById('pasuramList');
        list.innerHTML = '';
        pasuramItemsList = [];

        for (const key in parsedData) {
            for (const step in parsedData[key]) {
                const itemIndex = pasuramItemsList.length;
                pasuramItemsList.push({ key, step });

                const li = document.createElement('li');
                li.className = 'list-group-item';
                li.innerText = `${key} - Step ${step}`;
                li.onclick = () => selectPasuramByIndex(itemIndex);
                list.appendChild(li);
            }
        }

        if (pasuramItemsList.length > 0) {
            selectPasuramByIndex(0);
        }
    }

    function selectPasuramByIndex(index) {
        if (index < 0 || index >= pasuramItemsList.length) return;

        currentIndex = index;
        const { key, step } = pasuramItemsList[index];

        const listItems = document.querySelectorAll('.list-group-item');
        listItems.forEach(el => el.classList.remove('active'));
        if (listItems[index]) {
            listItems[index].classList.add('active');
            listItems[index].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        selectedKey = key;
        selectedStep = step;
        
        document.getElementById('currentEditingLabel').innerText = `Editing: ${key} (Step ${step})`;
        document.getElementById('pasuramEditor').value = parsedData[key][step] || '';

        updateNavButtons();
    }

    function navigate(direction) {
        const newIndex = currentIndex + direction;
        if (newIndex >= 0 && newIndex < pasuramItemsList.length) {
            selectPasuramByIndex(newIndex);
        }
    }

    function updateNavButtons() {
        document.getElementById('prevBtn').disabled = currentIndex <= 0;
        document.getElementById('nextBtn').disabled = currentIndex >= pasuramItemsList.length - 1;
    }

    document.getElementById('pasuramEditor').addEventListener('input', updateMemory);

    function updateMemory() {
        if (selectedKey && selectedStep && parsedData[selectedKey]) {
            parsedData[selectedKey][selectedStep] = document.getElementById('pasuramEditor').value;
        }
    }

  // Custom serializer to format objects like JS literals (single quotes for strings, unquoted numbers)
    function toJSLiteral(obj, indent = 0) {
        const spaces = ' '.repeat(indent);
        const innerSpaces = ' '.repeat(indent + 12);

        if (typeof obj !== 'object' || obj === null) {
            return JSON.stringify(obj);
        }

        let entries = [];
        for (const key in obj) {
            if (Object.prototype.hasOwnProperty.call(obj, key)) {
                const val = toJSLiteral(obj[key], indent + 12);
                // If key is purely numeric, output without quotes (e.g. 1: ), otherwise use single quotes ('key': )
                const formattedKey = /^\d+$/.test(key) ? key : `'${key}'`;
                entries.push(`${innerSpaces}${formattedKey}: ${val}`);
            }
        }

        if (entries.length === 0) return '{}';
        return `{\n${entries.join(',\n')}\n${spaces}}`;
    }

    async function saveFile() {
        if (!fileHandle) return;

        try {
            let updatedContent = originalFileContent;

            for (const [lang, data] of Object.entries(allBundles)) {
                // Serialize using JS literal formatting (single quotes for string keys, no quotes for numbers)
                const newFormattedJs = toJSLiteral(data, 0);
                const regex = new RegExp(`const\\s+text_bundle_${lang}\\s*=\\s*\\{[\\s\\S]*?\\};`);
                if (regex.test(updatedContent)) {
                    updatedContent = updatedContent.replace(regex, `const text_bundle_${lang} = ${newFormattedJs};`);
                }
            }

            const writable = await fileHandle.createWritable();
            await writable.write(updatedContent);
            await writable.close();

            alert('File saved successfully back to its original location!');
        } catch (err) {
            alert('Failed to save file: ' + err.message);
        }
    }

    window.onload = () => initKeyboard('ta');
</script>

</body>
</html>
