<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Prabandham Sandhai</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; flex-direction: column; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
        h2 { text-align: center; color: #1c1e21; margin-top: 0; font-size: 1.3rem; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: #4b4f56; font-weight: 600; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .learning-controls { background: #f9fafb; border: 1px solid #e4e6eb; padding: 15px; border-radius: 12px; margin: 15px 0; }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .nav-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-play { background-color: #0070ba; color: white; grid-column: span 3; margin-bottom: 5px; }
        .btn-nav { background-color: #e4e6eb; color: #050505; font-size: 0.75rem; }
        .active-mode { background-color: #0070ba !important; color: white !important; }
        audio { width: 100%; margin-top: 15px; }
        .status { margin-top: 10px; font-size: 0.75rem; font-weight: bold; color: #0070ba; text-align: center; min-height: 1.5em; border-top: 1px solid #eee; padding-top: 10px; }
        
        /* Marker Studio Styles */
        #session-log-container { width: 100%; max-width: 420px; margin-top: 20px; border: 2px solid #0070ba; padding: 15px; border-radius: 12px; background: #fff; }
        textarea { width: 100%; height: 150px; font-family: monospace; font-size: 0.75rem; padding: 10px; border: 1px solid #ccd0d5; border-radius: 8px; resize: vertical; box-sizing: border-box; }
        .recorder-hint { font-size: 0.7rem; color: #606770; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Divya Prabandham Anusandhanam</h2>
    
    <div class="input-group">
        <label>Select Prabandham</label>
        <select id="prefix" onchange="resetToStart()">
            <option value="TVM">Thiruvaimozhi (TVM)</option>
            <option value="PT">Periya Thirumozhi (PT)</option>
            <option value="PMT">Perumal Thirumozhi (PMT)</option>
            <option value="NAT">Naachiyar Thirumozhi (NAT)</option>
        </select>
    </div>

    <div class="input-group">
        <label id="numLabel">Current Pasuram</label>
        <input type="text" id="number" value="1.1.1" inputmode="decimal">
    </div>

    <div class="learning-controls">
        <label>Learning Mode</label>
        <div class="nav-controls" style="margin-top: 0; margin-bottom: 15px;">
            <button class="btn-nav active-mode" id="m-line" onclick="setMode('line')">Line</button>
            <button class="btn-nav" id="m-couplet" onclick="setMode('couplet')">Couplet</button>
            <button class="btn-nav" id="m-full" onclick="setMode('full')">Full</button>
        </div>

        <div class="flex-row">
            <div style="flex: 1;">
                <label style="font-weight: normal; font-size: 0.7rem;">Repeat Limit</label>
                <input type="number" id="repeatLimit" value="1" min="1">
            </div>
            <div style="flex: 2;">
                <label style="font-weight: normal; font-size: 0.7rem;">Auto-Advance</label>
                <select id="autoNext">
                    <option value="true">Next Pasuram</option>
                    <option value="false">Stop at End</option>
                </select>
            </div>
        </div>
    </div>

    <div class="nav-controls">
        <button class="btn-play" onclick="startLearning()">START RECITATION</button>
        <button class="btn-nav" onclick="navigate(-1)">Prev</button>
        <button class="btn-nav" onclick="stopAudio()">Stop</button> 
        <button class="btn-nav" onclick="navigate(1)">Next</button>
    </div>

    <audio id="audioPlayer" controls></audio>
    <div id="status" class="status">Ready</div>
    <div id="recorded-markers" class="recorder-hint">Press 'M' to log marker</div>
</div>

<div id="session-log-container">
    <h3 style="margin: 0 0 10px 0; color: #0070ba; font-size: 0.9rem;">Session Log (Paste into marker.js)</h3>
    <textarea id="final-session-output" readonly placeholder="Your recorded markers will appear here after each pasuram ends..."></textarea>
    <button class="btn-play" style="width: 100%; margin-top: 10px; font-size: 0.8rem;" onclick="copySessionLog()">COPY ALL MARKERS</button>
</div>

<script src="marker.js"></script>

<script>
    const CONFIG = {
        'TVM': { hasSub: true, maxCh: 10, maxSub: 10, defPas: 11, ex: {'2.7': 13} },
        'PT':  { hasSub: true, maxCh: 11, maxSub: 10, defPas: 10, ex: {} },
        'PMT': { hasSub: false, maxCh: 10, defPas: 10, ex: {} },
        'NAT': { hasSub: false, maxCh: 14, defPas: 10, ex: {} }
    };

    let currentRepeatCount = 0;
    let currentLineIndex = 0;
    let learningMode = 'line'; 
    let monitorInterval = null;
    const player = document.getElementById('audioPlayer');

    // --- SESSION RECORDER VARIABLES ---
    let currentSessionData = {}; 
    let activePasuramMarkers = []; 

    function setMode(mode) {
        learningMode = mode;
        document.querySelectorAll('.btn-nav').forEach(b => {
            if(b.id.startsWith('m-')) b.classList.remove('active-mode');
        });
        document.getElementById('m-' + mode).classList.add('active-mode');
        stopMonitor();
    }

    function stopMonitor() {
        if (monitorInterval) clearInterval(monitorInterval);
        monitorInterval = null;
    }

    function stopAudio() {
        stopMonitor();
        player.pause();
        document.getElementById('status').innerText = "Stopped";
    }

    function startLearning() {
        currentRepeatCount = 0;
        currentLineIndex = 0;
        activePasuramMarkers = []; // Clear current buffer for new start
        playAudio();
    }

    function playAudio() {
        stopMonitor();
        const pre = document.getElementById('prefix').value;
        const num = document.getElementById('number').value.trim();
        const status = document.getElementById('status');
        const limit = parseInt(document.getElementById('repeatLimit').value) || 1;
        
        const key = `${pre}.${num}`;
        const markers = window.MARKER_DATABASE ? window.MARKER_DATABASE[key] : null;

        const targetSrc = `https://www.uveda.org/media/recitation/${pre}.${num}.mp3`;
        if (player.src !== targetSrc) {
            player.src = targetSrc;
            player.load();
        }
        
        if (learningMode === 'full' || !markers) {
            status.innerText = `Full Mode | Repeat ${currentRepeatCount + 1}/${limit}`;
            player.play();
            return;
        }

        let start = (currentLineIndex === 0) ? 0 : markers[currentLineIndex - 1];
        let end = (learningMode === 'line') ? markers[currentLineIndex] : markers[currentLineIndex + 1];

        player.currentTime = start;
        player.play();

        if (end === undefined) {
            status.innerText = `Final Section | Repeat ${currentRepeatCount + 1}/${limit}`;
        } else {
            const displayIdx = Math.floor(currentLineIndex / (learningMode === 'couplet' ? 2 : 1) + 1);
            status.innerText = `Section ${displayIdx} | Repeat ${currentRepeatCount + 1}/${limit}`;
            
            monitorInterval = setInterval(() => {
                if (player.currentTime >= end) {
                    player.pause();
                    stopMonitor();
                    handleSegmentEnd(markers, limit);
                }
            }, 30);
        }
    }

    function handleSegmentEnd(markers, limit) {
        currentRepeatCount++;
        if (currentRepeatCount < limit) {
            playAudio(); 
        } else {
            currentRepeatCount = 0;
            advanceLine(markers);
        }
    }

    function advanceLine(markers) {
        const step = (learningMode === 'couplet') ? 2 : 1;
        currentLineIndex += step;

        if (markers && currentLineIndex <= markers.length) {
            playAudio();
        } else {
            const autoNext = document.getElementById('autoNext').value === "true";
            if (autoNext) {
                document.getElementById('status').innerText = "Pasuram Done. Advancing...";
                setTimeout(() => navigate(1), 1000);
            } else {
                document.getElementById('status').innerText = "Pasuram Complete.";
                currentLineIndex = 0;
            }
        }
    }

    function navigate(dir) {
        stopMonitor();
        const input = document.getElementById('number');
        const pre = document.getElementById('prefix').value;
        const c = CONFIG[pre];
        let parts = input.value.split('.').map(Number);
        
        let ch, sub, pas;
        if (c.hasSub) { [ch, sub, pas] = parts; } 
        else { [ch, pas] = parts; sub = 0; }
        
        pas += dir;
        const currentLimit = (c.ex[`${ch}.${sub}`] || c.ex[`${ch}`] || c.defPas);

        if (dir === 1) {
            if (pas > currentLimit) {
                pas = 1;
                if (c.hasSub) { sub++; if (sub > c.maxSub) { sub = 1; ch++; } } 
                else { ch++; }
            }
        } else {
            if (pas < 1) {
                if (c.hasSub) {
                    sub--;
                    if (sub < 1) {
                        if (ch > 1) { ch--; sub = c.maxSub; pas = (c.ex[`${ch}.${sub}`] || c.defPas); }
                        else { ch = 1; sub = 1; pas = 1; }
                    } else { pas = (c.ex[`${ch}.${sub}`] || c.defPas); }
                } else {
                    if (ch > 1) { ch--; pas = c.defPas; }
                    else { ch = 1; pas = 1; }
                }
            }
        }

        input.value = c.hasSub ? `${ch}.${sub}.${pas}` : `${ch}.${pas}`;
        startLearning();
    }

    function resetToStart() {
        const pre = document.getElementById('prefix').value;
        const label = document.getElementById('numLabel');
        const input = document.getElementById('number');
        stopMonitor();
        if (CONFIG[pre].hasSub) { label.innerText = "Current Pasuram (Ch.Sub.Pas)"; input.value = "1.1.1"; } 
        else { label.innerText = "Current Pasuram (Ch.Pas)"; input.value = "1.1"; }
    }

    // --- STUDIO RECORDER LOGIC ---
    function logMarker() {
        const currentTime = parseFloat(player.currentTime.toFixed(2));
        const pre = document.getElementById('prefix').value;
        const num = document.getElementById('number').value.trim();
        if (currentTime > 0) {
            activePasuramMarkers.push(currentTime);
            document.getElementById('recorded-markers').innerText = `Logged ${activePasuramMarkers.length} markers for ${pre}.${num}`;
            console.log(`Marker logged: ${currentTime}s`);
        }
    }

    function commitCurrentPasuram() {
        const pre = document.getElementById('prefix').value;
        const num = document.getElementById('number').value.trim();
        const key = `${pre}.${num}`;
        if (activePasuramMarkers.length > 0) {
            currentSessionData[key] = [...activePasuramMarkers];
            updateFinalOutput();
            activePasuramMarkers = []; 
            console.log(`Committed ${key} to session log.`);
        }
    }

    function updateFinalOutput() {
        const outputArea = document.getElementById('final-session-output');
        let formattedText = "";
        for (const [key, markers] of Object.entries(currentSessionData)) {
            formattedText += `    '${key}': [${markers.join(', ')}],\n`;
        }
        outputArea.value = formattedText;
    }

    function copySessionLog() {
        const outputArea = document.getElementById('final-session-output');
        outputArea.select();
        document.execCommand('copy');
        document.getElementById('status').innerText = "Copied to Clipboard!";
    }

    // Keyboard 'M' listener
    window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'm') {
            logMarker();
        }
    });

    player.onended = function() {
        commitCurrentPasuram(); // Auto-save what was just logged
        const limit = parseInt(document.getElementById('repeatLimit').value) || 1;
        const pre = document.getElementById('prefix').value;
        const num = document.getElementById('number').value.trim();
        const markers = window.MARKER_DATABASE ? window.MARKER_DATABASE[`${pre}.${num}`] : null;

        if (learningMode === 'full' || !markers || currentLineIndex >= markers.length - 1) {
            handleSegmentEnd(markers, limit);
        }
    };
</script>

</body>
</html>
