<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anusandhanam Studio</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; flex-direction: column; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
        h2 { text-align: center; color: #1c1e21; margin-top: 0; font-size: 1.3rem; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: #4b4f56; font-weight: 600; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .learning-controls { background: #f9fafb; border: 1px solid #e4e6eb; padding: 15px; border-radius: 12px; margin: 15px 0; }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .nav-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-play { background-color: #0070ba; color: white; grid-column: span 3; margin-bottom: 5px; }
        .btn-nav { background-color: #e4e6eb; color: #050505; font-size: 0.75rem; }
        .active-mode { background-color: #0070ba !important; color: white !important; }
        audio { width: 100%; margin-top: 15px; }
        .status { margin-top: 10px; font-size: 0.75rem; font-weight: bold; color: #0070ba; text-align: center; min-height: 1.5em; border-top: 1px solid #eee; padding-top: 10px; }
        #session-log-container { width: 100%; max-width: 420px; margin-top: 20px; border: 2px solid #0070ba; padding: 15px; border-radius: 12px; background: #fff; }
        textarea { width: 100%; height: 120px; font-family: monospace; font-size: 0.75rem; padding: 10px; border: 1px solid #ccd0d5; border-radius: 8px; resize: vertical; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="card">
    <h2>Anusandhanam Studio</h2>
    
    <div class="input-group">
        <label>Select Work</label>
        <select id="prefix" onchange="resetToStart()">
            <option value="TVM">Thiruvaimozhi (TVM)</option>
            <option value="PT">Periya Thirumozhi (PT)</option>
            <option value="PMT">Perumal Thirumozhi (PMT)</option>
            <option value="NAT">Naachiyar Thirumozhi (NAT)</option>
            <option value="MUM">Mumukshupadi (Charama Sloka)</option>
        </select>
    </div>

    <div class="input-group">
        <label id="numLabel">Current Pasuram</label>
        <input type="text" id="number" value="1.1.1" inputmode="decimal">
    </div>

    <div class="learning-controls">
        <label>Practice Mode</label>
        <div class="nav-controls" style="margin-top: 0; margin-bottom: 15px;">
            <button class="btn-nav active-mode" id="m-line" onclick="setMode('line')">Segment</button>
            <button class="btn-nav" id="m-couplet" onclick="setMode('couplet')">Pairs</button>
            <button class="btn-nav" id="m-full" onclick="setMode('full')">Full</button>
        </div>

        <div class="flex-row">
            <div style="flex: 1;">
                <label style="font-weight: normal; font-size: 0.7rem;">Repeat</label>
                <input type="number" id="repeatLimit" value="1" min="1">
            </div>
            <div style="flex: 2;">
                <label style="font-weight: normal; font-size: 0.7rem;">Auto-Advance</label>
                <select id="autoNext">
                    <option value="true">Next Section</option>
                    <option value="false">Stop</option>
                </select>
            </div>
        </div>
    </div>

    <div class="nav-controls">
        <button class="btn-play" onclick="startLearning()">START RECITATION</button>
        <button class="btn-nav" onclick="navigate(-1)">Prev</button>
        <button class="btn-nav" onclick="stopAudio()">Stop</button> 
        <button class="btn-nav" onclick="navigate(1)">Next</button>
    </div>

    <audio id="audioPlayer" controls></audio>
    <div id="status" class="status">Ready</div>
    <div id="recorded-markers" style="font-size: 0.7rem; color: #606770; text-align: center; margin-top: 5px;">Press 'M' to record markers</div>
</div>

<div id="session-log-container">
    <textarea id="final-session-output" readonly placeholder="Session markers for marker.js appear here..."></textarea>
    <button class="btn-play" style="width: 100%; margin-top: 10px; font-size: 0.8rem;" onclick="copySessionLog()">COPY MARKERS</button>
</div>

<script src="marker.js"></script>

<script>
const CONFIG = {
        'TVM': { 
            hasSub: true, maxCh: 10, maxSub: 10, defPas: 11, label: "Current Pasuram",
            getAudioSrc: (num) => `https://www.uveda.org/media/recitation/TVM.${num}.mp3` 
        },
        'PT':  { 
            hasSub: true, maxCh: 11, maxSub: 10, defPas: 10, label: "Current Pasuram",
            getAudioSrc: (num) => `https://www.uveda.org/media/recitation/PT.${num}.mp3` 
        },
        'PMT': { 
            hasSub: false, maxCh: 10, defPas: 10, label: "Current Pasuram",
            getAudioSrc: (num) => `https://www.uveda.org/media/recitation/PMT.${num}.mp3` 
        },
        'NAT': { 
            hasSub: false, maxCh: 14, defPas: 10, label: "Current Pasuram",
            getAudioSrc: (num) => `https://www.uveda.org/media/recitation/NAT.${num}.mp3` 
        },
        'MUM': { 
            hasSub: false, maxCh: 1, defPas: 200, label: "Current Suthram", isSingleFile: true,
            getAudioSrc: () => `audiofile/charamaslokam.mp3` // Always points to the master file
        }

    let currentRepeatCount = 0;
    let currentLineIndex = 0;
    let learningMode = 'line'; 
    let monitorInterval = null;
    let currentSessionData = {}; 
    let activePasuramMarkers = []; 
    const player = document.getElementById('audioPlayer');

    function setMode(mode) {
        learningMode = mode;
        document.querySelectorAll('.btn-nav').forEach(b => {
            if(b.id.startsWith('m-')) b.classList.remove('active-mode');
        });
        document.getElementById('m-' + mode).classList.add('active-mode');
        stopMonitor();
    }

    function stopMonitor() {
        if (monitorInterval) clearInterval(monitorInterval);
        monitorInterval = null;
    }

    function stopAudio() {
        stopMonitor();
        player.pause();
        document.getElementById('status').innerText = "Stopped";
    }

    function startLearning() {
        currentRepeatCount = 0;
        currentLineIndex = 0;
        activePasuramMarkers = []; 
        playAudio();
    }

 function playAudio() {
        stopMonitor();
        const pre = document.getElementById('prefix').value;
        const numInput = document.getElementById('number').value.trim();
        const status = document.getElementById('status');
        const limit = parseInt(document.getElementById('repeatLimit').value) || 1;
        
        const workConfig = CONFIG[pre];
        const audioSrc = workConfig.getAudioSrc(numInput); // Dynamically fetch path from CONFIG

        if (player.src.indexOf(audioSrc) === -1) {
            player.src = audioSrc;
            player.load();
        }

        if (workConfig.isSingleFile) {
            // Logic for Single File (Mumukshupadi)
            const suthramMarkers = window.MARKER_DATABASE ? window.MARKER_DATABASE[`${pre}.all`] : null;
            const suthramIdx = parseInt(numInput) - 1;
            
            if (!suthramMarkers || suthramMarkers[suthramIdx] === undefined) {
                status.innerText = "Suthram marker not found.";
                return;
            }

            let start = suthramMarkers[suthramIdx];
            let end = suthramMarkers[suthramIdx + 1]; 

            player.currentTime = start;
            player.play();
            status.innerText = `Suthram ${numInput} | Repeat ${currentRepeatCount + 1}/${limit}`;

            if (end !== undefined) {
                monitorInterval = setInterval(() => {
                    if (player.currentTime >= end) {
                        player.pause();
                        stopMonitor();
                        handleSegmentEnd(null, limit);
                    }
                }, 30);
            }
        } else {
            // Logic for Multi-file (Prabandhams)
            const key = `${pre}.${numInput}`;
            const markers = window.MARKER_DATABASE ? window.MARKER_DATABASE[key] : null;

            if (learningMode === 'full' || !markers) {
                status.innerText = `Full Mode | Repeat ${currentRepeatCount + 1}/${limit}`;
                player.play();
                return;
            }

            let start = (currentLineIndex === 0) ? 0 : markers[currentLineIndex - 1];
            let end = (learningMode === 'line') ? markers[currentLineIndex] : markers[currentLineIndex + 1];

            player.currentTime = start;
            player.play();

            if (end === undefined) {
                status.innerText = `Final Section | Repeat ${currentRepeatCount + 1}/${limit}`;
            } else {
                status.innerText = `Section ${currentLineIndex + 1} | Repeat ${currentRepeatCount + 1}/${limit}`;
                monitorInterval = setInterval(() => {
                    if (player.currentTime >= end) {
                        player.pause();
                        stopMonitor();
                        handleSegmentEnd(markers, limit);
                    }
                }, 30);
            }
        }
    }

    function handleSegmentEnd(markers, limit) {
        currentRepeatCount++;
        if (currentRepeatCount < limit) {
            playAudio(); 
        } else {
            currentRepeatCount = 0;
            const pre = document.getElementById('prefix').value;
            if (CONFIG[pre].isSingleFile) {
                // If auto-advance is on, move to the next suthram
                if (document.getElementById('autoNext').value === "true") {
                    navigate(1);
                } else {
                    document.getElementById('status').innerText = "Suthram Complete.";
                }
            } else {
                advanceLine(markers);
            }
        }
    }

    function advanceLine(markers) {
        const step = (learningMode === 'couplet') ? 2 : 1;
        currentLineIndex += step;

        if (markers && currentLineIndex <= markers.length) {
            playAudio();
        } else {
            if (document.getElementById('autoNext').value === "true") {
                setTimeout(() => navigate(1), 1000);
            } else {
                document.getElementById('status').innerText = "Complete.";
                currentLineIndex = 0;
            }
        }
    }

    function navigate(dir) {
        stopMonitor();
        const input = document.getElementById('number');
        const pre = document.getElementById('prefix').value;
        const c = CONFIG[pre];
        
        if (!c.hasSub) {
            let val = parseInt(input.value) + dir;
            if (val < 1) val = 1;
            input.value = val;
        } else {
            let parts = input.value.split('.').map(Number);
            let [ch, sub, pas] = parts;
            pas += dir;
            const currentLimit = (c.ex[`${ch}.${sub}`] || c.defPas);
            if (pas > currentLimit) { pas = 1; sub++; if (sub > c.maxSub) { sub = 1; ch++; } }
            if (pas < 1) { pas = c.defPas; sub--; if (sub < 1) { sub = c.maxSub; ch--; } }
            input.value = `${ch}.${sub}.${pas}`;
        }
        startLearning();
    }

    function resetToStart() {
        const pre = document.getElementById('prefix').value;
        const c = CONFIG[pre];
        document.getElementById('numLabel').innerText = c.label;
        document.getElementById('number').value = c.hasSub ? "1.1.1" : "1";
        stopMonitor();
    }

    function logMarker() {
        const currentTime = parseFloat(player.currentTime.toFixed(2));
        if (currentTime > 0) {
            activePasuramMarkers.push(currentTime);
            document.getElementById('recorded-markers').innerText = `Logged ${activePasuramMarkers.length} marks`;
        }
    }

    function commitCurrentPasuram() {
        const pre = document.getElementById('prefix').value;
        const key = CONFIG[pre].isSingleFile ? `${pre}.all` : `${pre}.${document.getElementById('number').value}`;
        
        if (activePasuramMarkers.length > 0) {
            if (!currentSessionData[key]) currentSessionData[key] = [];
            // For single file, we append to a master list
            if (CONFIG[pre].isSingleFile) {
                currentSessionData[key] = [...currentSessionData[key], ...activePasuramMarkers];
            } else {
                currentSessionData[key] = [...activePasuramMarkers];
            }
            
            let txt = "";
            for (let k in currentSessionData) txt += `    '${k}': [${currentSessionData[k].join(', ')}],\n`;
            document.getElementById('final-session-output').value = txt;
            activePasuramMarkers = []; 
        }
    }

    function copySessionLog() {
        const el = document.getElementById('final-session-output');
        el.select();
        document.execCommand('copy');
        document.getElementById('status').innerText = "Markers Copied!";
    }

    window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'm') logMarker(); });

    player.onended = function() {
        commitCurrentPasuram();
        const pre = document.getElementById('prefix').value;
        const num = document.getElementById('number').value.trim();
        const markers = window.MARKER_DATABASE ? window.MARKER_DATABASE[`${pre}.${num}`] : null;
        if (CONFIG[pre].isSingleFile || learningMode === 'full' || !markers || currentLineIndex >= markers.length - 1) {
            handleSegmentEnd(markers, parseInt(document.getElementById('repeatLimit').value) || 1);
        }
    };
</script>
</body>
</html>
