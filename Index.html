<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Prabhandam Anusandhanam</title>
    <!-- IMPORT THE CONFIG FILE HERE -->
    <script src="marker.js"></script>
    
    <style>
        :root { --primary: #0070ba; --secondary: #f4f7f9; --dark: #2d3436; }
        body { font-family: -apple-system, sans-serif; background: var(--secondary); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: white; width: 100%; max-width: 440px; padding: 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .section { background: #f8f9fa; padding: 15px; border-radius: 16px; margin-bottom: 20px; border: 1px solid #edf2f7; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: #7f8c8d; margin-bottom: 8px; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; box-sizing: border-box; }
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .mode-btn { background: #edf2f7; border: none; padding: 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .mode-btn.active { background: var(--primary); color: white; }
        .main-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-bottom: 12px; }
        .nav-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .nav-btn { padding: 12px; border: none; border-radius: 10px; background: var(--dark); color: white; font-weight: 600; cursor: pointer; }
        .status-area { text-align: center; margin-top: 20px; }
        #lineIndicator { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
        audio { width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Prabandham Learner</h2>

    <div class="section">
        <label>1. Selection</label>
        <select id="prefix">
            <option value="TVM">Thiruvaimozhi (TVM)</option>
            <option value="PT">Periya Thirumozhi (PT)</option>
            <option value="PMT">Perumal Thirumozhi (PMT)</option>
            <option value="NAT">Naachiyar (NAT)</option>
        </select>
        <input type="text" id="number" value="1.1.6" style="margin-top:10px;">
    </div>

    <div class="section">
        <label>2. Learning Mode</label>
        <div class="mode-grid">
            <button class="mode-btn active" id="btn-line" onclick="setMode('line')">Line</button>
            <button class="mode-btn" id="btn-couplet" onclick="setMode('couplet')">Couplet</button>
            <button class="mode-btn" id="btn-full" onclick="setMode('full')">Full</button>
        </div>
        <label>Repeats per segment</label>
        <input type="number" id="repeatLimit" value="3">
    </div>

    <button class="main-btn" onclick="startLearning()">START RECITATION</button>

    <div class="nav-grid">
        <button class="nav-btn" onclick="changeLine(-1)">Prev</button>
        <button class="nav-btn" onclick="togglePause()">Pause</button>
        <button class="nav-btn" onclick="changeLine(1)">Next</button>
    </div>

    <div class="status-area">
        <div id="lineIndicator">Line 1</div>
        <div id="subStatus">Ready</div>
    </div>

    <audio id="audioPlayer" controls></audio>
</div>

<script>
    let currentLineIndex = 0;
    let repeatsDone = 0;
    let currentMode = 'line';
    const player = document.getElementById('audioPlayer');

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + mode).classList.add('active');
        resetProgress();
    }

    function resetProgress() {
        currentLineIndex = 0;
        repeatsDone = 0;
    }

    function startLearning() {
        const pre = document.getElementById('prefix').value;
        const num = document.getElementById('number').value.trim();
        const key = `${pre}.${num}`;
        
        // Accessing the data from the external marker.js
        const database = window.MARKER_DATABASE;
        
        player.src = `https://www.uveda.org/media/recitation/${pre}.${num}.mp3`;
        
        if (!database || !database[key]) {
            document.getElementById('subStatus').innerText = "Markers not found in marker.js";
            player.play();
        } else {
            resetProgress();
            playSegment();
        }
    }

    function playSegment() {
        const pre = document.getElementById('prefix').value;
        const num = document.getElementById('number').value.trim();
        const markers = window.MARKER_DATABASE[`${pre}.${num}`];
        const limit = parseInt(document.getElementById('repeatLimit').value);

        let start = markers[currentLineIndex];
        let end;

        if (currentMode === 'line') {
            end = markers[currentLineIndex + 1];
            document.getElementById('lineIndicator').innerText = `Line ${currentLineIndex + 1}`;
        } else if (currentMode === 'couplet') {
            end = markers[Math.min(currentLineIndex + 2, markers.length - 1)];
            document.getElementById('lineIndicator').innerText = `Lines ${currentLineIndex + 1}-${currentLineIndex + 2}`;
        } else {
            start = markers[0];
            end = markers[markers.length - 1];
            document.getElementById('lineIndicator').innerText = `Full Pasuram`;
        }

        player.currentTime = start;
        player.play();

        const monitor = setInterval(() => {
            if (player.currentTime >= end) {
                player.pause();
                clearInterval(monitor);
                repeatsDone++;
                if (repeatsDone < limit) {
                    document.getElementById('subStatus').innerText = `Repeat ${repeatsDone + 1}/${limit}`;
                    playSegment();
                } else {
                    repeatsDone = 0;
                    advance(markers);
                }
            }
        }, 50);
    }

    function advance(markers) {
        const step = (currentMode === 'couplet') ? 2 : 1;
        if (currentMode === 'full') return;

        currentLineIndex += step;
        if (currentLineIndex < markers.length - 1) {
            playSegment();
        } else {
            document.getElementById('subStatus').innerText = "Complete!";
        }
    }

    function changeLine(dir) {
        currentLineIndex = Math.max(0, currentLineIndex + dir);
        repeatsDone = 0;
        playSegment();
    }

    function togglePause() {
        player.paused ? player.play() : player.pause();
    }
</script>

</body>
</html>
