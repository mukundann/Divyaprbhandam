<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Prabandham Player</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        h2 { text-align: center; color: #1c1e21; margin-top: 0; font-size: 1.4rem; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.9rem; margin-bottom: 8px; color: #4b4f56; font-weight: 600; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 16px; box-sizing: border-box; background-color: #fff; }
        button { width: 100%; padding: 14px; background-color: #0070ba; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:active { background-color: #005ea6; transform: scale(0.98); }
        audio { width: 100%; margin-top: 25px; }
        .status { margin-top: 15px; font-size: 0.7rem; color: #90949c; text-align: center; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>Prabandham Recitation</h2>
    
    <div class="input-group">
        <label for="prefix">Select Prabandham</label>
        <select id="prefix">
            <option value="TVM">Thiruvaimozhi (TVM)</option>
            <option value="PT">Periya Thirumozhi (PT)</option>
            <option value="PMT">Perumal Thirumozhi (PMT)</option>
            <option value="NAT">Natchiyar Thirumozhi (NAT)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="number">Input Number (e.g., 5.1.1)</label>
        <input type="text" id="number" placeholder="e.g. 5.1.1" inputmode="decimal" pattern="[0-9.]*">
    </div>

    <button onclick="playAudio()">Play Now</button>

    <audio id="audioPlayer" controls></audio>
    <div id="status" class="status"></div>
</div>

<script>
    function playAudio() {
        const prefix = document.getElementById('prefix').value;
        const number = document.getElementById('number').value.trim();
        const player = document.getElementById('audioPlayer');
        const status = document.getElementById('status');

        if (!number) {
            alert("Please enter a number (e.g., 5.1.1)");
            return;
        }

        // URL pattern: https://www.uveda.org/media/recitation/[PREFIX].[NUMBER].mp3
        const finalUrl = `https://www.uveda.org/media/recitation/${prefix}.${number}.mp3`;
        
        status.innerText = "Loading: " + finalUrl;
        
        player.pause();
        player.src = finalUrl;
        player.load();
        
        player.play().catch(error => {
            console.error("Playback error:", error);
            status.innerText = "Error: File not found for " + prefix + " " + number;
            alert("Could not find that specific recitation. Please check the number.");
        });
    }
</script>

</body>
</html>
