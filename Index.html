<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Prabandham Player</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 420px; }
        h2 { text-align: center; color: #1c1e21; margin-bottom: 20px; font-size: 1.3rem; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #4b4f56; font-weight: 600; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .nav-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-play { background-color: #0070ba; color: white; grid-column: span 3; margin-bottom: 5px; }
        .btn-nav { background-color: #e4e6eb; color: #050505; }
        button:active { transform: scale(0.95); opacity: 0.8; }
        audio { width: 100%; margin-top: 20px; }
        .status { margin-top: 15px; font-size: 0.7rem; color: #90949c; text-align: center; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>Prabandham Recitation</h2>
    
    <div class="input-group">
        <label>Select Prabandham</label>
        <select id="prefix" onchange="resetToStart()">
            <option value="TVM">Thiruvaimozhi (TVM)</option>
            <option value="PT">Periya Thirumozhi (PT)</option>
            <option value="PMT">Perumal Thirumozhi (PMT)</option>
            <option value="NAT">Naachiyar Thirumozhi (NAT)</option>
        </select>
    </div>

    <div class="input-group">
        <label id="numLabel">Number (Ch.Sub.Pasuram)</label>
        <input type="text" id="number" value="1.1.1" inputmode="decimal">
    </div>

    <div class="nav-controls">
        <button class="btn-play" onclick="playAudio()">Play Current</button>
        <button class="btn-nav" onclick="navigate(-1)">Prev</button>
        <button class="btn-nav" style="visibility:hidden"></button> 
        <button class="btn-nav" onclick="navigate(1)">Next</button>
    </div>

    <audio id="audioPlayer" controls></audio>
    <div id="status" class="status"></div>
</div>

<script>
    const CONFIG = {
        'TVM': { hasSub: true, maxCh: 10, maxSub: 10, defPas: 11, ex: {'2.7': 13} },
        'PT':  { hasSub: true, maxCh: 11, maxSub: 10, defPas: 10, ex: {} },
        'PMT': { hasSub: false, maxCh: 10, defPas: 10, ex: {} },
        'NAT': { hasSub: false, maxCh: 14, defPas: 10, ex: {} }
    };

    function getLimit(pre, ch, sub) {
        const c = CONFIG[pre];
        const key = c.hasSub ? `${ch}.${sub}` : `${ch}`;
        return c.ex[key] || c.defPas;
    }

    function playAudio() {
        const pre = document.getElementById('prefix').value;
        const num = document.getElementById('number').value.trim();
        const player = document.getElementById('audioPlayer');
        const status = document.getElementById('status');

        const url = `https://www.uveda.org/media/recitation/${pre}.${num}.mp3`;
        status.innerText = "Playing: " + pre + " " + num;
        
        player.src = url;
        player.load();
        player.play().catch(() => {
            status.innerText = "File not found: " + num;
        });
    }

    function navigate(dir) {
        const input = document.getElementById('number');
        const pre = document.getElementById('prefix').value;
        const c = CONFIG[pre];
        let parts = input.value.split('.').map(Number);
        
        let ch, sub, pas;
        if (c.hasSub) {
            [ch, sub, pas] = parts;
        } else {
            [ch, pas] = parts;
            sub = 0; 
        }
        
        pas += dir;

        if (dir === 1) { // Next
            if (pas > getLimit(pre, ch, sub)) {
                pas = 1;
                if (c.hasSub) {
                    sub++;
                    if (sub > c.maxSub) { sub = 1; ch++; }
                } else {
                    ch++;
                }
            }
            if (ch > c.maxCh) ch = c.maxCh;
        } else { // Prev
            if (pas < 1) {
                if (c.hasSub) {
                    sub--;
                    if (sub < 1) {
                        if (ch > 1) { ch--; sub = c.maxSub; pas = getLimit(pre, ch, sub); }
                        else { ch = 1; sub = 1; pas = 1; }
                    } else { pas = getLimit(pre, ch, sub); }
                } else {
                    if (ch > 1) { ch--; pas = getLimit(pre, ch, 0); }
                    else { ch = 1; pas = 1; }
                }
            }
        }

        input.value = c.hasSub ? `${ch}.${sub}.${pas}` : `${ch}.${pas}`;
        playAudio();
    }

    function resetToStart() {
        const pre = document.getElementById('prefix').value;
        const label = document.getElementById('numLabel');
        const input = document.getElementById('number');
        
        if (CONFIG[pre].hasSub) {
            label.innerText = "Number (Ch.Sub.Pasuram)";
            input.value = "1.1.1";
        } else {
            label.innerText = "Number (Chapter.Pasuram)";
            input.value = "1.1";
        }
    }
</script>

</body>
</html>
