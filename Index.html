<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recitation Player</title>
    <style>
        :root {
            --primary-color: #0070ba;
            --bg-color: #f4f7f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #333;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #666;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px; /* Prevents iOS zoom on focus */
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background-color: #005ea6;
            transform: scale(0.98);
        }

        audio {
            width: 100%;
            margin-top: 20px;
        }

        .status {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #888;
            text-align: center;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Audio Recitation</h2>
    
    <div class="input-group">
        <label for="prefix">Prefix</label>
        <input type="text" id="prefix" value="TVM" autocomplete="off">
    </div>

    <div class="input-group">
        <label for="number">Input Number (e.g., 5.1.1)</label>
        <input type="text" id="number" placeholder="5.1.1" pattern="[0-9.]*" inputmode="decimal">
    </div>

    <button onclick="handlePlay()">Play Now</button>

    <audio id="audioPlayer" controls>
        Your browser does not support audio.
    </audio>
    
    <div id="status" class="status"></div>
</div>

<script>
    function handlePlay() {
        const prefix = document.getElementById('prefix').value.trim();
        const number = document.getElementById('number').value.trim();
        const player = document.getElementById('audioPlayer');
        const status = document.getElementById('status');

        if (!prefix || !number) {
            alert("Please fill in both fields.");
            return;
        }

        // Construct the URL
        const audioUrl = `https://www.uveda.org/media/recitation/${prefix}.${number}.mp3`;
        
        status.innerText = "Attempting to load: " + audioUrl;

        // Mobile optimization: Reset, Load, then Play
        player.pause();
        player.src = audioUrl;
        player.load(); // Required for some mobile browsers to register the new source

        // Play returns a promise in modern browsers
        const playPromise = player.play();

        if (playPromise !== undefined) {
            playPromise.catch(error => {
                console.error("Playback error:", error);
                status.innerText = "Error: File not found or playback blocked.";
            });
        }
    }
</script>

</body>
</html>
