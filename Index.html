<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Prabandham Anusandhanam</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
        h2 { text-align: center; color: #1c1e21; margin-top: 0; font-size: 1.3rem; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: #4b4f56; font-weight: 600; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .learning-controls { background: #f9fafb; border: 1px solid #e4e6eb; padding: 15px; border-radius: 12px; margin: 15px 0; }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .nav-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 15px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-play { background-color: #0070ba; color: white; grid-column: span 3; }
        .btn-nav { background-color: #e4e6eb; color: #050505; }
        audio { width: 100%; margin-top: 15px; }
        .status { margin-top: 10px; font-size: 0.7rem; color: #0070ba; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Divya Prabandham Anusandhanam</h2>
    
    <div class="input-group">
        <label>Select Prabandham</label>
        <select id="prefix" onchange="resetToStart()">
            <option value="TVM">Thiruvaimozhi (TVM)</option>
            <option value="PT">Periya Thirumozhi (PT)</option>
            <option value="PMT">Perumal Thirumozhi (PMT)</option>
            <option value="NAT">Naachiyar Thirumozhi (NAT)</option>
        </select>
    </div>

    <div class="input-group">
        <label id="numLabel">Current Pasuram (Ch.Sub.Pas)</label>
        <input type="text" id="number" value="1.1.1" inputmode="decimal">
    </div>

    <div class="learning-controls">
        <label>Learning Settings</label>
        <div class="flex-row">
            <div style="flex: 1;">
                <label style="font-weight: normal; font-size: 0.7rem;">Repeat Pasuram</label>
                <input type="number" id="repeatLimit" value="1" min="1">
            </div>
            <div style="flex: 2;">
                <label style="font-weight: normal; font-size: 0.7rem;">Auto-Advance</label>
                <select id="autoNext">
                    <option value="true">Yes, move to next</option>
                    <option value="false">No, stop here</option>
                </select>
            </div>
        </div>
    </div>

    <div class="nav-controls">
        <button class="btn-play" onclick="startLearning()">START RECITATION</button>
        <button class="btn-nav" onclick="navigate(-1)">Prev</button>
        <button class="btn-nav" onclick="stopAudio()">Stop</button> 
        <button class="btn-nav" onclick="navigate(1)">Next</button>
    </div>

    <audio id="audioPlayer" controls></audio>
    <div id="status" class="status">Ready</div>
</div>

<script src="marker.js"></script>

<script>
    const CONFIG = {
        'TVM': { 
            hasSub: true, maxCh: 10, maxSub: 10, defPas: 11, ex: {'2.7': 13},
            getAudioSrc: (num) => `https://www.uveda.org/media/recitation/TVM.${num}.mp3`
        },
        'PT':  { 
            hasSub: true, maxCh: 11, maxSub: 10, defPas: 10, ex: {},
            getAudioSrc: (num) => `https://www.uveda.org/media/recitation/PT.${num}.mp3`
        },
 'PMT': { 
    hasSub: false, 
    maxCh: 10, 
    defPas: 10, 
    ex: {},
    // Chapter 1 and 2 are handled as single files by our automation
    isSingleFile: (num) => {
        const chapter = parseInt(num.split('.')[0]);
        return chapter === 1 || chapter === 2;
    },
    getAudioSrc: (num) => {
        const chapter = parseInt(num.split('.')[0]);
        
        // Routing logic based on chapter availability
        if (chapter === 1) {
            return `audiofiles/PMT.1.all.m4a`; 
        } 
        if (chapter === 2) {
            // Using the OGG version for Chapter 2
            return `audiofiles/PMT.2.all.ogg`;
        }
        
        // Default remote fallback for Chapters 3-10
        return `https://www.uveda.org/media/recitation/PMT.${num}.mp3`;
    }
},


        'NAT': { 
            hasSub: false, maxCh: 14, defPas: 10, ex: {},
             isSingleFile: (num) => parseInt(num.split('.')[0]) === 1,
            getAudioSrc: (num) => {
                const chapter = parseInt(num.split('.')[0]);
                return chapter === 2 
                    ? `audiofiles/NAT.2.all.m4a` 
                    : `https://www.uveda.org/media/recitation/NAT.${num}.mp3`;
            }
           
        }
    };

    let currentRepeatCount = 0;
    let monitorInterval = null;
    const player = document.getElementById('audioPlayer');

    function getLimit(pre, ch, sub) {
        const c = CONFIG[pre];
        const key = c.hasSub ? `${ch}.${sub}` : `${ch}`;
        return c.ex[key] || c.defPas;
    }

    function stopMonitor() {
        if (monitorInterval) clearInterval(monitorInterval);
        monitorInterval = null;
    }

    function stopAudio() {
        stopMonitor();
        player.pause();
        document.getElementById('status').innerText = "Stopped";
    }

    function startLearning() {
        currentRepeatCount = 0;
        playAudio();
    }

    function playAudio() {
        stopMonitor();
        const pre = document.getElementById('prefix').value;
        const numInput = document.getElementById('number').value.trim();
        const status = document.getElementById('status');
        const limit = parseInt(document.getElementById('repeatLimit').value);
        
        const workConfig = CONFIG[pre];
        const isSingle = typeof workConfig.isSingleFile === 'function' ? workConfig.isSingleFile(numInput) : false;
        const audioSrc = workConfig.getAudioSrc(numInput);

        if (player.src.indexOf(audioSrc) === -1) {
            player.src = audioSrc;
            player.load();
        }

        if (isSingle) {
            const parts = numInput.split('.');
            const chapter = parts[0];
            const pasuramIdx = parseInt(parts[1] || parts[0]) - 1;
            const masterKey = `${pre}.${chapter}.all`; 
            const masterMarkers = window.MARKER_DATABASE ? window.MARKER_DATABASE[masterKey] : null;
            
            if (!masterMarkers || masterMarkers[pasuramIdx] === undefined) {
                status.innerText = "Marker not found for " + numInput;
                return;
            }

            let start = masterMarkers[pasuramIdx];
            let end = masterMarkers[pasuramIdx + 1]; 

            player.currentTime = start;
            player.play();
            status.innerText = `Playing ${numInput} | Repeat ${currentRepeatCount + 1}/${limit}`;

            if (end !== undefined) {
                monitorInterval = setInterval(() => {
                    if (player.currentTime >= end) {
                        player.pause();
                        stopMonitor();
                        onTrackEnded();
                    }
                }, 30);
            }
        } else {
            status.innerText = `Playing ${numInput} | Repeat ${currentRepeatCount + 1}/${limit}`;
            player.play().catch(() => { status.innerText = "File not found: " + numInput; });
        }
    }

    function onTrackEnded() {
        const limit = parseInt(document.getElementById('repeatLimit').value);
        const autoNext = document.getElementById('autoNext').value === "true";
        currentRepeatCount++;

        if (currentRepeatCount < limit) {
            playAudio();
        } else {
            currentRepeatCount = 0;
            if (autoNext) navigate(1);
            else document.getElementById('status').innerText = "Finished repeats.";
        }
    }

    player.onended = onTrackEnded;

    function navigate(dir) {
        stopMonitor();
        const input = document.getElementById('number');
        const pre = document.getElementById('prefix').value;
        const c = CONFIG[pre];
        let parts = input.value.split('.').map(Number);
        
        let ch, sub, pas;
        if (c.hasSub) { [ch, sub, pas] = parts; } 
        else { [ch, pas] = parts; sub = 0; }
        
        pas += dir;
        if (dir === 1) {
            if (pas > getLimit(pre, ch, sub)) {
                pas = 1;
                if (c.hasSub) { sub++; if (sub > c.maxSub) { sub = 1; ch++; } } 
                else { ch++; }
            }
            if (ch > c.maxCh) ch = c.maxCh;
        } else {
            if (pas < 1) {
                if (c.hasSub) {
                    sub--;
                    if (sub < 1) {
                        if (ch > 1) { ch--; sub = c.maxSub; pas = getLimit(pre, ch, sub); }
                        else { ch = 1; sub = 1; pas = 1; }
                    } else { pas = getLimit(pre, ch, sub); }
                } else {
                    if (ch > 1) { ch--; pas = getLimit(pre, ch, 0); }
                    else { ch = 1; pas = 1; }
                }
            }
        }
        input.value = c.hasSub ? `${ch}.${sub}.${pas}` : `${ch}.${pas}`;
        startLearning();
    }

    function resetToStart() {
        const pre = document.getElementById('prefix').value;
        const label = document.getElementById('numLabel');
        const input = document.getElementById('number');
        currentRepeatCount = 0;
        stopMonitor();
        if (CONFIG[pre].hasSub) {
            label.innerText = "Current Pasuram (Ch.Sub.Pas)";
            input.value = "1.1.1";
        } else {
            label.innerText = "Current Pasuram (Ch.Pas)";
            input.value = "1.1";
        }
    }
</script>
</body>
</html>
